<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Rohan's Whiteboard</title>
<style>
:root{--purple:#6541b8;--purple2:#805bd0;--ink:#252333;--muted:#777486;--line:#e7e4ed;--panel:#fff;--orange:#f59e0b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;color:var(--ink);background:#f5f3f8}button,input{font:inherit}button{cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;min-width:0}
header{height:58px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 18px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:15px;white-space:nowrap}.logo{width:31px;height:31px;border-radius:9px;background:linear-gradient(140deg,#7853c8,#b69ae9);display:grid;place-items:center;color:white;font-size:19px}
.project{border:0;background:transparent;font-size:13px;color:#5f5a6b;padding:8px 10px;border-radius:7px}.project:hover{background:#f5f1fb}
.header-tools{display:flex;align-items:center;gap:7px;margin-left:auto}.headbtn{border:1px solid #e5e1eb;background:white;color:#504b5c;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:650}.headbtn:hover{background:#f5f1fb}.headbtn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
#workspace{flex:1;min-height:0;display:flex;gap:5px;padding:6px;position:relative;overflow:hidden}
.pane{flex:1;min-width:0;min-height:0;position:relative;background:#fff;border:1px solid #e2dee9;border-radius:9px;overflow:hidden}
.pane[hidden]{display:none}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.pane-label{position:absolute;top:13px;right:15px;z-index:2;font-size:10px;color:#a09baa;pointer-events:none;letter-spacing:.04em}
.floatbar{position:absolute;z-index:10;left:14px;top:50%;transform:translateY(-50%);width:58px;padding:8px 6px;background:#fff;border:1px solid #e4dfeb;border-radius:15px;box-shadow:0 5px 22px #2c21421c;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none}
.floatbar.right{left:auto;right:14px}
.grip{height:17px;width:100%;display:grid;place-items:center;color:#b2acbc;cursor:grab;touch-action:none;font-size:15px;letter-spacing:2px}
.tbtn{width:42px;height:42px;border:0;border-radius:10px;background:transparent;color:#625d6c;display:grid;place-items:center;position:relative}
.tbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn:hover{background:#f4f0fa;color:var(--purple)}.tbtn.active{background:#eee8fa;color:var(--purple);box-shadow:inset 0 0 0 1px #d8c9f3}
.sep{height:1px;width:29px;background:#ece8f0;margin:4px 0}
.palette{display:grid;grid-template-columns:repeat(2,15px);gap:6px;padding:4px 0}.swatch{width:15px;height:15px;border-radius:50%;border:1px solid #0002;box-shadow:0 0 0 1px #fff}.swatch.selected{outline:2px solid var(--purple);outline-offset:2px}
.size-pop{position:absolute;left:68px;top:50%;transform:translateY(-50%);width:190px;padding:12px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px #261b3a24;display:none;gap:9px;flex-direction:column}.floatbar.right .size-pop{left:auto;right:68px}.size-pop.open{display:flex}.size-pop label{font-size:11px;color:#6d6877;font-weight:700}.size-pop input{width:100%;accent-color:var(--purple)}
.bottom{height:55px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;z-index:12}
.page-actions{display:flex;align-items:center;gap:5px}.pagebtn{height:31px;min-width:32px;border:1px solid #e5e1eb;background:#fff;border-radius:7px;color:#5c5668;font-size:12px}.pagebtn:hover{background:#f4f0fa}.pagebtn.add{background:var(--purple);border-color:var(--purple);color:#fff}
.pages{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:auto;padding:4px}.pagechip{height:34px;min-width:42px;border:1px solid #e7e2ed;background:#faf9fc;border-radius:7px;color:#696374;font-size:11px}.pagechip.active{border:2px solid var(--purple);background:#f3eefb;color:var(--purple);font-weight:750}
.pageright{font-size:11px;color:#8c8795;white-space:nowrap}
.toast{position:fixed;bottom:70px;left:50%;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:#30283d;color:white;padding:9px 14px;border-radius:9px;font-size:12px;z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.menu{position:absolute;top:54px;left:16px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #261b3a24;padding:7px;display:none;min-width:190px}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:white;padding:10px;border-radius:7px;font-size:12px;color:#514b5d}.menu button:hover{background:#f4f0fa}
@media(max-width:650px){header{height:52px;padding:0 9px;gap:6px}.brand{font-size:12px}.project{display:none}.headbtn{padding:7px 8px;font-size:11px}.floatbar{left:7px;width:49px;padding:6px 3px}.floatbar.right{right:7px}.tbtn{width:39px;height:39px}.size-pop{left:55px}.floatbar.right .size-pop{right:55px}.bottom{height:49px;padding:0 6px}.pageright{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="brand"><div class="logo">✎</div><span>Whiteboard</span></div>
 <button class="project" id="projectName">Untitled board ▾</button>
 <div class="header-tools">
  <button class="headbtn" id="backgroundBtn">Background</button>
  <button class="headbtn" id="zoomOut">−</button><button class="headbtn" id="zoomRead">100%</button><button class="headbtn" id="zoomIn">＋</button>
  <button class="headbtn" id="splitBtn">Split whiteboard</button>
  <button class="headbtn" id="exportBtn">Export</button>
  <button class="headbtn primary" id="saveBtn">Save</button>
 </div>
</header>
<main id="workspace">
 <section class="pane" id="pane-left"><span class="pane-label">WHITEBOARD 1</span><canvas id="canvas-left"></canvas>
  <div class="floatbar" id="bar-left"><div class="grip" data-grip="left">•••</div>
   <button class="tbtn active" data-side="left" data-tool="pen" title="Pen"><svg viewBox="0 0 24 24"><path d="m4 20 4-1 11-11a2 2 0 0 0-3-3L5 16z"/><path d="m14 6 4 4"/></svg></button>
   <button class="tbtn" data-side="left" data-tool="highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="m4 15 10-10 6 6-10 10H4z"/><path d="M3 21h18"/></svg></button>
   <button class="tbtn" data-side="left" data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="m7 5 4-4 9 9-8 8-8-8z"/><path d="m11 18 3 3h7"/></svg></button>
   <button class="tbtn" data-side="left" data-tool="ruler" title="Straight line"><svg viewBox="0 0 24 24"><path d="m3 17 14-14 4 4L7 21z"/><path d="m14 6 4 4M10 10l2 2M7 13l2 2"/></svg></button>
   <button class="tbtn" data-side="left" data-tool="pan" title="Move canvas"><svg viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 0 1 4 0v6-8a2 2 0 0 1 4 0v9-6a2 2 0 0 1 4 0v9c0 5-3 8-8 8h-1c-3 0-5-2-7-5l-2-3a2 2 0 0 1 3-2z"/></svg></button>
   <div class="sep"></div><div class="palette" data-palette="left">
    <button class="swatch selected" data-color="#252333" style="background:#252333"></button><button class="swatch" data-color="#2563eb" style="background:#2563eb"></button><button class="swatch" data-color="#dc2626" style="background:#dc2626"></button><button class="swatch" data-color="#16a34a" style="background:#16a34a"></button><button class="swatch" data-color="#f59e0b" style="background:#f59e0b"></button><button class="swatch" data-color="#9333ea" style="background:#9333ea"></button>
   </div>
   <button class="tbtn" data-side="left" data-action="size" title="Pen size"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
   <button class="tbtn" data-side="left" data-action="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg></button>
   <button class="tbtn" data-side="left" data-action="clear" title="Clear drawings"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
   <div class="size-pop" id="size-left"><label>Pen thickness <span id="width-left">4</span></label><input type="range" min="1" max="28" value="4" data-width="left"><label>Eraser size <span id="erase-left">24</span></label><input type="range" min="8" max="80" value="24" data-erase="left"></div>
  </div>
 </section>
 <section class="pane" id="pane-right" hidden><span class="pane-label">WHITEBOARD 2</span><canvas id="canvas-right"></canvas>
  <div class="floatbar right" id="bar-right"><div class="grip" data-grip="right">•••</div>
   <button class="tbtn active" data-side="right" data-tool="pen" title="Pen"><svg viewBox="0 0 24 24"><path d="m4 20 4-1 11-11a2 2 0 0 0-3-3L5 16z"/><path d="m14 6 4 4"/></svg></button>
   <button class="tbtn" data-side="right" data-tool="highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="m4 15 10-10 6 6-10 10H4z"/><path d="M3 21h18"/></svg></button>
   <button class="tbtn" data-side="right" data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="m7 5 4-4 9 9-8 8-8-8z"/><path d="m11 18 3 3h7"/></svg></button>
   <button class="tbtn" data-side="right" data-tool="ruler" title="Straight line"><svg viewBox="0 0 24 24"><path d="m3 17 14-14 4 4L7 21z"/><path d="m14 6 4 4M10 10l2 2M7 13l2 2"/></svg></button>
   <button class="tbtn" data-side="right" data-tool="pan" title="Move canvas"><svg viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 0 1 4 0v6-8a2 2 0 0 1 4 0v9-6a2 2 0 0 1 4 0v9c0 5-3 8-8 8h-1c-3 0-5-2-7-5l-2-3a2 2 0 0 1 3-2z"/></svg></button>
   <div class="sep"></div><div class="palette" data-palette="right">
    <button class="swatch selected" data-color="#252333" style="background:#252333"></button><button class="swatch" data-color="#2563eb" style="background:#2563eb"></button><button class="swatch" data-color="#dc2626" style="background:#dc2626"></button><button class="swatch" data-color="#16a34a" style="background:#16a34a"></button><button class="swatch" data-color="#f59e0b" style="background:#f59e0b"></button><button class="swatch" data-color="#9333ea" style="background:#9333ea"></button>
   </div>
   <button class="tbtn" data-side="right" data-action="size" title="Pen size"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
   <button class="tbtn" data-side="right" data-action="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg></button>
   <button class="tbtn" data-side="right" data-action="clear" title="Clear drawings"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
   <div class="size-pop" id="size-right"><label>Pen thickness <span id="width-right">4</span></label><input type="range" min="1" max="28" value="4" data-width="right"><label>Eraser size <span id="erase-right">24</span></label><input type="range" min="8" max="80" value="24" data-erase="right"></div>
  </div>
 </section>
 <div class="menu" id="backgroundMenu"><button data-bg="plain">Plain white</button><button data-bg="grid">Small grid</button><button data-bg="lined">Writing lines</button><button data-bg="dots">Dots</button></div>
</main>
<footer class="bottom">
 <div class="page-actions"><button class="pagebtn" id="prev">‹</button><button class="pagebtn add" id="add">＋</button><button class="pagebtn" id="next">›</button></div>
 <div class="pages" id="pages"></div><span class="pageright" id="pageCount">Page 1 of 1</span>
</footer>
<div class="toast" id="toast"></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='rohan-promethean-whiteboard-v5';
const sides=['left','right'];
const fresh=()=>({strokes:[],undo:[],redo:[],zoom:1,panX:0,panY:0,tool:'pen',color:'#252333',width:4,eraser:24,bg:'grid'});
const state={left:{pages:[fresh()],index:0},right:{pages:[fresh()],index:0}};
const canv={},ctx={},activePointers={left:new Map(),right:new Map()};
let split=false;
function page(s){return state[s].pages[state[s].index]}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1800)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,split}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.state){sides.forEach(s=>{if(d.state[s]?.pages?.length)state[s]=d.state[s]});split=!!d.split}}catch(e){}}
function snapshot(s){const p=page(s);p.undo.push(JSON.stringify(p.strokes));if(p.undo.length>80)p.undo.shift();p.redo=[]}
function drawStroke(c,st){if(!st.points?.length)return;c.save();c.globalCompositeOperation=st.tool==='eraser'?'destination-out':'source-over';c.globalAlpha=st.tool==='highlighter'?.28:1;c.strokeStyle=st.color;c.lineWidth=st.tool==='eraser'?st.width:st.tool==='highlighter'?Math.max(st.width,13):st.width;c.lineCap=st.tool==='highlighter'?'square':'round';c.lineJoin='round';c.beginPath();c.moveTo(st.points[0].x,st.points[0].y);if(st.points.length===1)c.lineTo(st.points[0].x+.1,st.points[0].y+.1);else st.points.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.stroke();c.restore()}
function paintBackground(s){const c=ctx[s],w=canv[s].width,h=canv[s].height,d=window.devicePixelRatio||1,p=page(s);c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,w,h);c.restore();c.setTransform(d*p.zoom,0,0,d*p.zoom,d*p.panX,d*p.panY);const scale=d*p.zoom;c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,w,h);c.restore();if(p.bg!=='plain'){const gap=(p.bg==='lined'?34:p.bg==='dots'?24:28)*scale;c.save();c.strokeStyle=p.bg==='lined'?'#dce7f5':'#e9e5ef';c.fillStyle='#e3deea';c.lineWidth=1;const ox=((p.panX*scale)%gap+gap)%gap,oy=((p.panY*scale)%gap+gap)%gap;if(p.bg==='dots'){for(let x=ox;x<w;x+=gap)for(let y=oy;y<h;y+=gap){c.beginPath();c.arc(x,y,1.1,0,Math.PI*2);c.fill()}}else if(p.bg==='lined'){for(let y=oy;y<h;y+=gap){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}else{for(let x=ox;x<w;x+=gap){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=oy;y<h;y+=gap){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}c.restore()}p.strokes.forEach(st=>drawStroke(c,st));c.setTransform(d,0,0,d,0,0)}
function resize(s){const r=canv[s].getBoundingClientRect(),d=Math.min(3,window.devicePixelRatio||1);if(!r.width||!r.height)return;const w=Math.round(r.width*d),h=Math.round(r.height*d);if(canv[s].width!==w||canv[s].height!==h){canv[s].width=w;canv[s].height=h}paintBackground(s)}
function pos(s,e){const r=canv[s].getBoundingClientRect(),p=page(s);return{x:(e.clientX-r.left-p.panX)/p.zoom,y:(e.clientY-r.top-p.panY)/p.zoom}}
function setTool(s,t){page(s).tool=t;document.querySelectorAll('[data-side="'+s+'"][data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));save()}
function redraw(s){paintBackground(s)}
function start(s,e){const p=page(s),tool=p.tool;if(e.button!==undefined&&e.button!==0)return;const point=pos(s,e);if(tool==='pan'||e.button===1){activePointers[s].set(e.pointerId,{pan:true,x:e.clientX,y:e.clientY,px:p.panX,py:p.panY});canv[s].setPointerCapture(e.pointerId);e.preventDefault();return}const st={tool,color:p.color,width:tool==='eraser'?p.eraser:p.width,points:[point]};snapshot(s);activePointers[s].set(e.pointerId,{st,last:point});canv[s].setPointerCapture(e.pointerId);drawStroke(ctx[s],st);e.preventDefault()}
function move(s,e){const a=activePointers[s].get(e.pointerId);if(!a)return;const p=page(s);if(a.pan){p.panX=a.px+(e.clientX-a.x);p.panY=a.py+(e.clientY-a.y);redraw(s);e.preventDefault();return}const point=pos(s,e);a.st.points.push(point);if(a.st.tool==='ruler'){redraw(s);drawStroke(ctx[s],{...a.st,points:[a.st.points[0],point]})}else{const last=a.last;a.last=point;drawStroke(ctx[s],{...a.st,points:[last,point]})}e.preventDefault()}
function end(s,e){const a=activePointers[s].get(e.pointerId);if(!a)return;activePointers[s].delete(e.pointerId);if(a.st){if(a.st.tool==='ruler')a.st.points=[a.st.points[0],a.last||a.st.points.at(-1)];page(s).strokes.push(a.st);redraw(s);renderPages();save()}}
function undo(s){const p=page(s);if(!p.undo.length)return toast('Nothing to undo');p.redo.push(JSON.stringify(p.strokes));p.strokes=JSON.parse(p.undo.pop());redraw(s);renderPages();save()}
function clear(s){const p=page(s);if(!p.strokes.length)return;snapshot(s);p.strokes=[];redraw(s);renderPages();save()}
function renderPages(){const el=$('pages');el.innerHTML='';const list=state.left.pages;list.forEach((p,i)=>{const b=document.createElement('button');b.className='pagechip'+(i===state.left.index?' active':'');b.textContent=''+(i+1);b.onclick=()=>{state.left.index=i;state.right.index=Math.min(i,state.right.pages.length-1);sides.forEach(redraw);renderPages();save()};el.append(b)});$('pageCount').textContent='Page '+(state.left.index+1)+' of '+list.length}
function addPage(){sides.forEach(s=>{const p=fresh();state[s].pages.splice(state[s].index+1,0,p);state[s].index++});sides.forEach(redraw);renderPages();save()}
function setSplit(v){split=v;$('pane-right').hidden=!v;$('splitBtn').textContent=v?'Exit split':'Split whiteboard';$('pane-left').querySelector('.pane-label').textContent=v?'WHITEBOARD 1 · LEFT':'WHITEBOARD';requestAnimationFrame(()=>sides.forEach(s=>{resize(s);redraw(s)}));save()}
function updateZoom(){const z=page('left').zoom;$('zoomRead').textContent=Math.round(z*100)+'%'}
function zoom(f){sides.forEach(s=>{const p=page(s);p.zoom=Math.max(.25,Math.min(3,p.zoom*f));redraw(s)});updateZoom();save()}
sides.forEach(s=>{canv[s]=$('canvas-'+s);ctx[s]=canv[s].getContext('2d');canv[s].addEventListener('pointerdown',e=>start(s,e));canv[s].addEventListener('pointermove',e=>move(s,e));['pointerup','pointercancel','lostpointercapture'].forEach(n=>canv[s].addEventListener(n,e=>end(s,e)));new ResizeObserver(()=>resize(s)).observe(canv[s].parentElement)});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.side,b.dataset.tool));
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{const s=b.closest('[data-palette]').dataset.palette;page(s).color=b.dataset.color;b.parentElement.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===b));save()});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const s=b.dataset.side;if(b.dataset.action==='size')$('size-'+s).classList.toggle('open');if(b.dataset.action==='undo')undo(s);if(b.dataset.action==='clear'){clear(s);toast('Drawings cleared')}});
document.querySelectorAll('[data-width]').forEach(i=>i.oninput=()=>{const s=i.dataset.width;page(s).width=+i.value;$('width-'+s).textContent=i.value;save()});
document.querySelectorAll('[data-erase]').forEach(i=>i.oninput=()=>{const s=i.dataset.erase;page(s).eraser=+i.value;$('erase-'+s).textContent=i.value;save()});
function dragBar(s){const bar=$('bar-'+s),grip=bar.querySelector('.grip');let drag=null;grip.addEventListener('pointerdown',e=>{const r=bar.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};grip.setPointerCapture(e.pointerId);e.preventDefault()});grip.addEventListener('pointermove',e=>{if(!drag)return;const pane=$('pane-'+s).getBoundingClientRect();const x=Math.max(0,Math.min(pane.width-bar.offsetWidth,e.clientX-pane.left-drag.x)),y=Math.max(0,Math.min(pane.height-bar.offsetHeight,e.clientY-pane.top-drag.y));bar.style.left=x+'px';bar.style.right='auto';bar.style.top=y+'px';bar.style.transform='none'});['pointerup','pointercancel'].forEach(n=>grip.addEventListener(n,()=>drag=null))}
sides.forEach(dragBar);
$('splitBtn').onclick=()=>setSplit(!split);$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('zoomRead').onclick=()=>{sides.forEach(s=>{page(s).zoom=1;page(s).panX=0;page(s).panY=0;redraw(s)});updateZoom();save()};
$('backgroundBtn').onclick=()=> $('backgroundMenu').classList.toggle('open');
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{sides.forEach(s=>{page(s).bg=b.dataset.bg;redraw(s)});$('backgroundMenu').classList.remove('open');save()});
document.addEventListener('click',e=>{if(!e.target.closest('#backgroundBtn')&&!e.target.closest('#backgroundMenu'))$('backgroundMenu').classList.remove('open')});
$('add').onclick=addPage;$('prev').onclick=()=>{state.left.index=Math.max(0,state.left.index-1);state.right.index=Math.min(state.left.index,state.right.pages.length-1);sides.forEach(redraw);renderPages();save()};$('next').onclick=()=>{state.left.index=Math.min(state.left.pages.length-1,state.left.index+1);state.right.index=Math.min(state.left.index,state.right.pages.length-1);sides.forEach(redraw);renderPages();save()};
$('saveBtn').onclick=()=>{save();toast('Board saved on this device')};
$('exportBtn').onclick=()=>{const s='left',a=document.createElement('a');a.download='whiteboard.png';a.href=canv[s].toDataURL('image/png');a.click()};
$('projectName').onclick=()=>{const name=prompt('Name this whiteboard project','Untitled board');if(name){$('projectName').textContent=name+' ▾';localStorage.setItem(KEY+'-name',name)}};
load();const savedName=localStorage.getItem(KEY+'-name');if(savedName)$('projectName').textContent=savedName+' ▾';
sides.forEach(s=>{const p=page(s);$('width-'+s).textContent=p.width;$('erase-'+s).textContent=p.eraser;document.querySelector('[data-width="'+s+'"]').value=p.width;document.querySelector('[data-erase="'+s+'"]').value=p.eraser;document.querySelectorAll('[data-palette="'+s+'"] .swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color===p.color));setTool(s,p.tool)});
setSplit(split);requestAnimationFrame(()=>sides.forEach(resize));renderPages();updateZoom();
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo('left')}if(e.key==='Escape')document.querySelectorAll('.size-pop').forEach(x=>x.classList.remove('open'))});
})();
</script>
</body>
</html>
