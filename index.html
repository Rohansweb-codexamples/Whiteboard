<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f28a22">
<title>Rohan's Interactive Whiteboard</title>
<style>
:root{--orange:#f28a22;--orange-dark:#db7010;--ink:#252b35;--muted:#707986;--line:#e2e5e9;--chrome:#fff;--canvas:#fff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f2f3f5}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}
.app{height:100dvh;display:flex;flex-direction:column;min-height:0}
.top{height:58px;flex:none;background:#fff;display:flex;align-items:center;padding:0 16px;gap:13px;border-bottom:1px solid #d9dce1;z-index:5}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#ffb33d,#ed7416);display:grid;place-items:center;color:#fff;font-size:23px;font-weight:900}.brand{font-size:16px;font-weight:800;white-space:nowrap}.board-title{border:0;border-bottom:1px solid transparent;padding:7px 8px;width:175px;outline:0;font-weight:600;color:#505762}.board-title:focus{border-color:var(--orange);background:#fff9f2}.spacer{flex:1}.status{font-size:11px;color:#8b929c;white-space:nowrap}.topbtn{height:36px;min-width:38px;padding:0 11px;border:1px solid #dfe2e6;border-radius:8px;background:#fff;color:#454c56;font-size:13px;font-weight:700}.topbtn:hover{background:#fff5e9;border-color:#f3b36c}.topbtn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.main{display:flex;flex:1;min-height:0;padding:0;gap:0}
.rail{width:68px;flex:none;background:#fff;border-right:1px solid #dfe2e6;display:flex;flex-direction:column;align-items:center;padding:10px 7px;gap:5px;z-index:3;overflow-y:auto}
.tool{width:50px;height:48px;border:0;border-radius:10px;background:transparent;color:#555e69;display:grid;place-items:center;position:relative;flex:none}
.tool svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:#fff3e4;color:#c96b13}.tool.active{background:#ffead2;color:#bd5d08;box-shadow:inset 0 0 0 1px #f6c58e}
.tool[title]:hover:after{content:attr(title);position:absolute;left:57px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#252b35;color:white;padding:7px 9px;border-radius:6px;font-size:11px;z-index:20;pointer-events:none}
.rail-sep{height:1px;background:#e6e8eb;width:34px;margin:4px 0;flex:none}
.stage{position:relative;flex:1;min-width:0;min-height:0;background:#e9ebee;overflow:hidden}
.canvas-area{position:absolute;inset:0;background:#fff;overflow:hidden;touch-action:none;cursor:crosshair}
canvas{display:block;width:100%;height:100%}
.bottom{height:66px;flex:none;background:#fff;border-top:1px solid #d9dce1;display:flex;align-items:center;justify-content:center;gap:12px;padding:7px 14px;z-index:4}
.palette{display:flex;align-items:center;gap:9px}.swatch{width:31px;height:31px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #cbd0d7;flex:none}.swatch.selected{box-shadow:0 0 0 3px var(--orange)}.swatch.white{border:1px solid #bfc4cc}
.bottom-sep{height:34px;width:1px;background:#e2e5e9}.size-wrap{display:flex;align-items:center;gap:9px;color:#5e6671;font-size:12px}.size-wrap input{width:95px;accent-color:var(--orange)}
.pages{height:43px;flex:none;background:#f7f8f9;border-top:1px solid #e1e4e8;display:flex;align-items:center;gap:7px;padding:0 12px;overflow-x:auto}
.page-tab{border:1px solid #dfe2e6;background:#fff;border-radius:7px;padding:7px 13px;font-size:12px;color:#505762;white-space:nowrap}.page-tab.active{border-color:var(--orange);color:#b95e0d;background:#fff8f0;font-weight:700}.page-add{border:0;background:transparent;color:#bd650e;font-size:22px;width:32px}
.float{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#fff;padding:5px;border:1px solid #dfe2e6;border-radius:10px;box-shadow:0 3px 14px #00000012;z-index:2}.float button{border:0;background:#fff;border-radius:7px;padding:8px 10px;color:#4c5560;font-size:12px;font-weight:700}.float button:hover{background:#fff0df}
.zoom{position:absolute;right:13px;bottom:13px;display:flex;align-items:center;gap:3px;background:#fff;border:1px solid #dfe2e6;border-radius:9px;padding:4px;z-index:2;box-shadow:0 2px 10px #00000012}.zoom button{border:0;background:transparent;width:30px;height:29px;border-radius:6px;font-size:18px;color:#4f5864}.zoom button:hover{background:#fff1e2}.zoom span{font-size:11px;min-width:40px;text-align:center;color:#626b76}
.help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#a0a6ae;pointer-events:none}.help b{display:block;color:#78818c;font-size:19px;margin-bottom:6px}.help span{font-size:13px}
.modal-back{position:absolute;inset:0;background:#171b2290;display:none;align-items:center;justify-content:center;z-index:10;padding:18px}.modal{width:min(420px,100%);background:#fff;border-radius:15px;padding:20px;box-shadow:0 16px 50px #0004}.modal h2{font-size:18px;margin:0 0 12px}.modal p{font-size:13px;color:#6c7480}.modal input{width:100%;padding:12px;border:1px solid #dfe2e6;border-radius:8px;margin:8px 0 15px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:700px){.top{height:52px;padding:0 8px;gap:7px}.brand{font-size:13px}.logo{width:31px;height:31px}.board-title{display:none}.status{display:none}.topbtn{height:33px;padding:0 8px;font-size:11px}.rail{width:54px;padding:7px 4px;gap:3px}.tool{width:43px;height:43px}.tool svg{width:21px;height:21px}.bottom{height:58px;gap:8px;padding:5px 7px}.palette{gap:6px}.swatch{width:25px;height:25px}.size-wrap{gap:4px}.size-wrap input{width:55px}.pages{height:38px}.float{top:7px}.float button{padding:7px 8px;font-size:11px}}
@media(max-width:390px){.brand{display:none}.top{justify-content:flex-end}.swatch{width:22px;height:22px}.bottom{gap:5px}.size-wrap input{width:42px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo">W</div><div class="brand">Interactive Whiteboard</div>
 <input id="boardTitle" class="board-title" value="Untitled lesson" aria-label="Board title">
 <div class="spacer"></div><span id="status" class="status">Ready</span>
 <button class="topbtn" id="undo" title="Undo">↶ Undo</button><button class="topbtn" id="redo" title="Redo">↷ Redo</button>
 <button class="topbtn" id="clear" title="Clear this page">Clear</button><button class="topbtn orange" id="fullscreen">⛶</button>
</header>
<main class="main">
<nav class="rail" aria-label="Whiteboard tools">
 <button class="tool active" data-tool="pen" title="Pen"><svg viewBox="0 0 24 24"><path d="m4 20 4-1 11-11a2 2 0 0 0-3-3L5 16zM14 6l4 4"/></svg></button>
 <button class="tool" data-tool="highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="m4 15 9-9 6 6-9 9H4zM13 6l3-3 6 6-3 3M4 21h16"/></svg></button>
 <button class="tool" data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="m7 20-4-4a2 2 0 0 1 0-3l9-9a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-7 7H7zM8 8l8 8M14 20h7"/></svg></button>
 <div class="rail-sep"></div>
 <button class="tool" data-tool="line" title="Straight line"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/></svg></button>
 <button class="tool" data-tool="arrow" title="Arrow"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7"/></svg></button>
 <button class="tool" data-tool="rect" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg></button>
 <button class="tool" data-tool="circle" title="Circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
 <div class="rail-sep"></div>
 <button class="tool" data-tool="text" title="Text"><svg viewBox="0 0 24 24"><path d="M4 5V3h16v2M12 3v18M8 21h8"/></svg></button>
 <button class="tool" data-tool="sticky" title="Sticky note"><svg viewBox="0 0 24 24"><path d="M5 3h14v13l-5 5H5zM14 21v-5h5M8 8h8M8 12h4"/></svg></button>
 <button class="tool" id="imageTool" title="Insert picture"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg></button><input type="file" id="imageFile" accept="image/*" hidden>
 <div class="rail-sep"></div>
 <button class="tool" data-tool="laser" title="Laser pointer"><svg viewBox="0 0 24 24"><path d="m14 4 6 6M12 6l6 6M4 20l8-8M4 20l3-1-2-2z"/></svg></button>
 <button class="tool" id="background" title="Change background"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg></button>
</nav>
<section class="stage">
 <div class="canvas-area" id="canvasArea"><canvas id="boardCanvas"></canvas><div class="help" id="help"><b>Start your lesson</b><span>Choose a pen and write anywhere on the board</span></div></div>
 <div class="float"><button id="addText">＋ Text</button><button id="addImage">＋ Picture</button><button id="addPage">＋ New page</button></div>
 <div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button><button id="zoomReset" title="Reset zoom">↺</button></div>
</section>
</main>
<div class="bottom">
 <div class="palette" id="palette">
  <button class="swatch selected" data-color="#20242b" style="background:#20242b" aria-label="Black"></button>
  <button class="swatch" data-color="#e53935" style="background:#e53935" aria-label="Red"></button>
  <button class="swatch" data-color="#1976d2" style="background:#1976d2" aria-label="Blue"></button>
  <button class="swatch" data-color="#159447" style="background:#159447" aria-label="Green"></button>
  <button class="swatch" data-color="#f3c623" style="background:#f3c623" aria-label="Yellow"></button>
  <button class="swatch" data-color="#ef7b18" style="background:#ef7b18" aria-label="Orange"></button>
  <button class="swatch" data-color="#8b4acb" style="background:#8b4acb" aria-label="Purple"></button>
  <button class="swatch white" data-color="#ffffff" style="background:#fff" aria-label="White"></button>
 </div>
 <div class="bottom-sep"></div>
 <div class="size-wrap"><span>Size</span><input type="range" id="strokeSize" min="2" max="28" value="5"><b id="sizeLabel">5</b></div>
</div>
<div class="pages" id="pages"><button class="page-tab active" data-page="0">Page 1</button><button class="page-add" id="pagePlus">+</button></div>
<div class="modal-back" id="modalBack"><div class="modal"><h2 id="modalTitle">Add text</h2><p id="modalHelp">Enter the text to place on the board.</p><input id="modalInput" autocomplete="off"><div class="modal-actions"><button class="topbtn" id="modalCancel">Cancel</button><button class="topbtn orange" id="modalOk">Add to board</button></div></div></div>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("boardCanvas"),ctx=canvas.getContext("2d"),area=$("canvasArea");
let pages=[[]],page=0,tool="pen",color="#20242b",stroke=5,zoom=1,offset={x:0,y:0},drawing=false,start=null,preview=null,history=[],redoHistory=[],bgMode=0,modalAction=null;
const imageCache=new Map();
function current(){return pages[page]}
function setStatus(s){$("status").textContent=s}
function save(){try{localStorage.setItem("rohans-interactive-whiteboard",JSON.stringify({pages:pages,title:$("boardTitle").value,bgMode}));setStatus("Saved on this device")}catch(e){setStatus("Storage full — export your work")}}
let saveTimer;
function scheduleSave(){setStatus("Saving…");clearTimeout(saveTimer);saveTimer=setTimeout(save,250)}
function snapshot(){history.push(JSON.stringify(pages));if(history.length>80)history.shift();redoHistory=[];updateHistory()}
function updateHistory(){$("undo").disabled=!history.length;$("redo").disabled=!redoHistory.length}
function load(){try{const data=JSON.parse(localStorage.getItem("rohans-interactive-whiteboard"));if(data){if(Array.isArray(data.pages)&&data.pages.length)pages=data.pages;$("boardTitle").value=data.title||"Untitled lesson";bgMode=data.bgMode||0}}catch(e){pages=[[]]}}
function resize(){const r=area.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);render()}
new ResizeObserver(resize).observe(area);
function setCanvasBackground(){area.style.backgroundColor="#fff";area.style.backgroundImage=bgMode===1?"linear-gradient(#e7ebef 1px,transparent 1px),linear-gradient(90deg,#e7ebef 1px,transparent 1px)":bgMode===2?"radial-gradient(#d9dee4 1px,transparent 1px)":"none";area.style.backgroundSize=bgMode===1?"28px 28px":bgMode===2?"22px 22px":"auto"}
function draw(o,c){c.save();c.translate(offset.x,offset.y);c.scale(zoom,zoom);c.globalAlpha=o.alpha===undefined?1:o.alpha;c.strokeStyle=o.color||"#20242b";c.fillStyle=o.color||"#20242b";c.lineWidth=o.size||5;c.lineCap="round";c.lineJoin="round";c.setLineDash([]);
if(o.type==="path"){if(o.points&&o.points.length){c.beginPath();c.moveTo(o.points[0].x,o.points[0].y);for(let i=1;i<o.points.length;i++)c.lineTo(o.points[i].x,o.points[i].y);c.stroke()}}
if(o.type==="line"||o.type==="arrow"){c.beginPath();c.moveTo(o.x1,o.y1);c.lineTo(o.x2,o.y2);c.stroke();if(o.type==="arrow"){const a=Math.atan2(o.y2-o.y1,o.x2-o.x1),h=16;c.beginPath();c.moveTo(o.x2,o.y2);c.lineTo(o.x2-h*Math.cos(a-.5),o.y2-h*Math.sin(a-.5));c.moveTo(o.x2,o.y2);c.lineTo(o.x2-h*Math.cos(a+.5),o.y2-h*Math.sin(a+.5));c.stroke()}}
if(o.type==="rect")c.strokeRect(o.x,o.y,o.w,o.h);
if(o.type==="circle"){c.beginPath();c.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2),Math.abs(o.h/2),0,0,Math.PI*2);c.stroke()}
if(o.type==="text"){c.font="bold "+o.fontSize+"px Arial";c.textBaseline="top";c.fillText(o.text,o.x,o.y)}
if(o.type==="sticky"){c.fillStyle=o.fill||"#fff1a8";c.fillRect(o.x,o.y,o.w,o.h);c.fillStyle="#403b2e";c.font="18px Arial";c.textBaseline="top";const words=(o.text||"").split(/\s+/);let line="",y=o.y+13;for(const word of words){const test=line?line+" "+word:word;if(c.measureText(test).width>o.w-22&&line){c.fillText(line,o.x+11,y);line=word;y+=23}else line=test}if(line)c.fillText(line,o.x+11,y)}
if(o.type==="image"&&o.src){let im=imageCache.get(o.src);if(!im){im=new Image();imageCache.set(o.src,im);im.onload=render;im.src=o.src}if(im.complete&&im.naturalWidth)c.drawImage(im,o.x,o.y,o.w,o.h)}
c.restore()}
function render(){const r=area.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);current().forEach(o=>draw(o,ctx));if(preview)draw(preview,ctx);$("help").style.display=current().length?"none":"block";setCanvasBackground();updatePages()}
function updatePages(){const holder=$("pages");holder.querySelectorAll("[data-page]").forEach(b=>{b.classList.toggle("active",Number(b.dataset.page)===page);b.textContent="Page "+(Number(b.dataset.page)+1)})}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-offset.x)/zoom,y:(e.clientY-r.top-offset.y)/zoom}}
function selectTool(t){tool=t;document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));area.style.cursor=t==="text"?"text":t==="laser"?"none":"crosshair"}
function openModal(title,help,placeholder,action){$("modalTitle").textContent=title;$("modalHelp").textContent=help;$("modalInput").value="";$("modalInput").placeholder=placeholder||"";$("modalBack").style.display="flex";modalAction=action;$("modalInput").focus()}
function closeModal(){ $("modalBack").style.display="none";modalAction=null}
function commitModal(){const value=$("modalInput").value.trim();if(value&&modalAction){snapshot();modalAction(value);scheduleSave();render()}closeModal()}
$("modalOk").onclick=commitModal;$("modalCancel").onclick=closeModal;$("modalBack").addEventListener("pointerdown",e=>{if(e.target===$("modalBack"))closeModal()});$("modalInput").addEventListener("keydown",e=>{if(e.key==="Enter")commitModal();if(e.key==="Escape")closeModal()});
function down(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();const p=point(e);if(tool==="text"){openModal("Add text","Type a heading, label or instruction to put on the board.","Type something…",v=>current().push({type:"text",x:p.x,y:p.y,text:v,color,fontSize:Math.max(20,stroke*5)}));return}if(tool==="sticky"){openModal("Sticky note","Add a note for your lesson or class.","Write a note…",v=>current().push({type:"sticky",x:p.x,y:p.y,w:205,h:150,text:v,fill:"#fff1a8"}));return}drawing=true;start=p;area.setPointerCapture(e.pointerId);if(tool==="pen"||tool==="highlighter"||tool==="eraser"||tool==="laser"){preview={type:"path",points:[p],color:tool==="eraser"?"#ffffff":tool==="laser"?"#ed3434":color,size:tool==="highlighter"?stroke*3:tool==="eraser"?stroke*4:stroke,alpha:tool==="highlighter"?.32:1}}else preview={type:tool,x:p.x,y:p.y,w:0,h:0,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color,size:stroke};render()}
function move(e){if(!drawing)return;const p=point(e);if(preview.type==="path")preview.points.push(p);else{preview.x2=p.x;preview.y2=p.y;preview.x=Math.min(start.x,p.x);preview.y=Math.min(start.y,p.y);preview.w=p.x-start.x;preview.h=p.y-start.y}render()}
function up(){if(!drawing)return;drawing=false;if(preview){snapshot();current().push(preview);preview=null;scheduleSave()}render()}
area.addEventListener("pointerdown",down);area.addEventListener("pointermove",move);area.addEventListener("pointerup",up);area.addEventListener("pointercancel",up);
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>selectTool(b.dataset.tool));
document.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll("[data-color]").forEach(x=>x.classList.toggle("selected",x===b))});
$("strokeSize").oninput=e=>{stroke=Number(e.target.value);$("sizeLabel").textContent=stroke};
function addPage(){snapshot();pages.push([]);page=pages.length-1;render();scheduleSave()}
$("addPage").onclick=addPage;$("pagePlus").onclick=addPage;
$("pages").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(!b)return;page=Number(b.dataset.page);render()});
$("undo").onclick=()=>{if(!history.length)return;redoHistory.push(JSON.stringify(pages));pages=JSON.parse(history.pop());page=Math.min(page,pages.length-1);updateHistory();render();scheduleSave()};
$("redo").onclick=()=>{if(!redoHistory.length)return;history.push(JSON.stringify(pages));pages=JSON.parse(redoHistory.pop());page=Math.min(page,pages.length-1);updateHistory();render();scheduleSave()};
$("clear").onclick=()=>{if(!current().length)return;if(!confirm("Clear everything on this page?"))return;snapshot();pages[page]=[];render();scheduleSave()};
$("boardTitle").oninput=scheduleSave;
$("background").onclick=()=>{bgMode=(bgMode+1)%3;setCanvasBackground();scheduleSave()};
function setZoom(v){zoom=Math.max(.4,Math.min(2.5,v));$("zoomLabel").textContent=Math.round(zoom*100)+"%";render()}
$("zoomIn").onclick=()=>setZoom(zoom*1.15);$("zoomOut").onclick=()=>setZoom(zoom/1.15);$("zoomReset").onclick=()=>{zoom=1;offset={x:0,y:0};setZoom(1)};
function chooseImage(){$("imageFile").click()}
$("imageTool").onclick=chooseImage;$("addImage").onclick=chooseImage;
$("imageFile").onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{snapshot();const w=Math.min(im.width,500),h=im.height*w/im.width;current().push({type:"image",src:reader.result,x:60,y:60,w,h});render();scheduleSave()};im.src=reader.result};reader.readAsDataURL(file);e.target.value=""};
$("addText").onclick=()=>{selectTool("text");setStatus("Tap the board to place text")};
$("fullscreen").onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}};
document.addEventListener("keydown",e=>{if($("modalBack").style.display==="flex")return;if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){$("undo").click();e.preventDefault()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){$("redo").click();e.preventDefault()}else if(e.key.toLowerCase()==="p")selectTool("pen");else if(e.key.toLowerCase()==="h")selectTool("highlighter");else if(e.key.toLowerCase()==="e")selectTool("eraser");else if(e.key.toLowerCase()==="t")selectTool("text")});
load();updateHistory();setCanvasBackground();resize();setStatus("Ready");
})();
</script>
</body>
</html>
