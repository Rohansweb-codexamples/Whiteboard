<title>Rohan's Whiteboard</title>
<style>
:root{--purple:#6541b8;--purple2:#805bd0;--ink:#252333;--muted:#777486;--line:#e7e4ed;--panel:#fff;--orange:#f59e0b}

.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:15px;white-space:nowrap}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#ff9b38 0%,#f05d88 52%,#7654d8 100%);display:grid;place-items:center;color:#fff;box-shadow:0 3px 9px #e77c8a45}

.logo{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(145deg,#ffb13d 0%,#ff7c43 54%,#ed5b72 100%);box-shadow:0 3px 9px #f18a5540}

.logo-board-back{left:7px;top:6px;transform:rotate(-9deg);opacity:.78}

.project{border:0;background:transparent;font-size:13px;color:#5f5a6b;padding:8px 10px;border-radius:7px}.project:hover{background:#f5f1fb}
.header-tools{display:flex;align-items:center;gap:7px;margin-left:auto}.headbtn{border:1px solid #e5e1eb;background:white;color:#504b5c;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:650}.headbtn:hover{background:#f5f1fb}.headbtn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}

.floatbar{touch-action:auto;overflow:visible}
.grip{touch-action:none;user-select:none}

@media(max-width:650px){#backgroundMenu{top:58px;left:8px}}

.tbtn:hover{background:#f4f0fa;color:var(--purple)}.tbtn.active{background:#eee8fa;color:var(--purple);box-shadow:inset 0 0 0 1px #d8c9f3}
.sep{height:28px;width:1px;flex:none;background:#ece8f0;margin:0 4px}
.palette{display:flex;flex-direction:row;align-items:center;gap:7px;padding:4px 5px}
.swatch{width:19px;height:19px;flex:none}
.size-pop{position:absolute;left:50%;top:auto;bottom:calc(100% + 12px);transform:translateX(-50%);width:210px;max-width:calc(100vw - 28px);padding:14px;background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 28px #261b3a24;display:none;gap:10px;flex-direction:column}

.size-pop.open{display:flex}
.size-pop label{font-size:12px;color:#6d6877;font-weight:700}
.size-pop input{width:100%;accent-color:var(--purple);cursor:pointer}
.palette{display:grid;grid-template-columns:repeat(2,15px);gap:6px;padding:4px 0}.swatch{width:15px;height:15px;border-radius:50%;border:1px solid #0002;box-shadow:0 0 0 1px #fff}.swatch.selected{outline:2px solid var(--purple);outline-offset:2px}
.size-pop{position:absolute;left:68px;top:50%;transform:translateY(-50%);width:190px;padding:12px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px #261b3a24;display:none;gap:9px;flex-direction:column}.floatbar.right .size-pop{left:auto;right:68px}.size-pop.open{display:flex}.size-pop label{font-size:11px;color:#6d6877;font-weight:700}.size-pop input{width:100%;accent-color:var(--purple)}
.bottom{height:55px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;z-index:12}
.page-actions{display:flex;align-items:center;gap:5px}.pagebtn{height:31px;min-width:32px;border:1px solid #e5e1eb;background:#fff;border-radius:7px;color:#5c5668;font-size:12px}.pagebtn:hover{background:#f4f0fa}.pagebtn.add{background:var(--purple);border-color:var(--purple);color:#fff}
.pages{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:auto;padding:4px}.pagechip{height:34px;min-width:42px;border:1px solid #e7e2ed;background:#faf9fc;border-radius:7px;color:#696374;font-size:11px}.pagechip.active{border:2px solid var(--purple);background:#f3eefb;color:var(--purple);font-weight:750}
.pageright{font-size:11px;color:#8c8795;white-space:nowrap}
.toast{position:fixed;bottom:70px;left:50%;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:#30283d;color:white;padding:9px 14px;border-radius:9px;font-size:12px;z-index:50;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.menu{position:absolute;top:54px;left:16px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #261b3a24;padding:7px;display:none;min-width:190px}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:white;padding:10px;border-radius:7px;font-size:12px;color:#514b5d}.menu button:hover{background:#f4f0fa}
@media(max-width:850px){header{height:54px;padding:0 9px;gap:6px}.brand{font-size:12px}.project{display:none}.headbtn{padding:7px 8px;font-size:11px}.floatbar{bottom:9px;max-width:calc(100% - 12px);gap:3px;padding:6px 7px}.tbtn{width:36px;height:38px}.tbtn .mi{font-size:21px}.palette{gap:5px;padding:3px}.swatch{width:17px;height:17px}.grip{width:18px}.size-pop{bottom:calc(100% + 9px)}.bottom{height:49px;padding:0 6px}.pageright{display:none}}
@media(max-width:520px){.floatbar{max-width:calc(100% - 8px);gap:1px;padding:5px 4px}.tbtn{width:31px;height:34px}.tbtn .mi{font-size:19px}.swatch{width:14px;height:14px}.palette{gap:4px}.sep{margin:0 2px;height:23px}.grip{width:15px;margin-right:1px}.size-pop{width:190px}}

/* Final split-toolbar and popup positioning overrides */
.floatbar{left:50%;right:auto;top:auto;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px);flex-direction:row;overflow:visible;touch-action:auto}

}

/* Clean logo, Google Material Symbols and reliable floating popovers */
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#6044b8,#8866dc);box-shadow:0 3px 10px #6541b833;display:grid;place-items:center;overflow:hidden}
.logo-icon{font-size:24px!important;color:#fff;font-variation-settings:'FILL' 1}

.size-pop,.floatbar.right .size-pop{position:fixed!important;left:0;top:0;right:auto;bottom:auto;transform:none;z-index:250;width:220px;max-width:calc(100vw - 24px);display:none;pointer-events:auto}
.size-pop.open{display:flex}
#backgroundMenu{z-index:260}


/* Side-mounted tool rails and split divider */
.floatbar,.floatbar.right{left:12px;right:auto;top:50%;bottom:auto;transform:translateY(-50%);width:58px;max-width:calc(100% - 18px);padding:9px 7px;flex-direction:column;gap:5px;border-radius:17px}
.floatbar.right{left:12px;right:auto}
.grip{width:100%;height:18px;border-right:0;border-bottom:1px dotted #c9c2d3;margin:0 0 3px}
.palette{display:grid;grid-template-columns:repeat(2,17px);gap:7px;padding:5px 0}
.sep{width:27px;height:1px;margin:3px 0}.tbtn{width:40px;height:39px}
#workspace.is-split{gap:0;padding:6px 10px}

.view-switch{display:flex;align-items:center;gap:6px;background:#faf9fc;color:#756d80;border-style:dashed;padding:7px 10px}.view-switch .mi{font-size:17px}
#dashboard{display:none!important}#dashboard.is-open{display:block!important}.dashboard{position:fixed;inset:58px 0 55px;z-index:180;background:#f7f5fa;padding:clamp(18px,4vw,48px);overflow:auto}
.dash-top{max-width:1050px;margin:0 auto 28px;display:flex;justify-content:space-between;align-items:flex-start}

.dash-top p,.dash-section p{color:#817b8d;font-size:13px;margin:8px 0 0}
.dash-close{border:1px solid #e6e1ec;background:#fff;border-radius:11px;width:40px;height:40px;color:#625a70}
.dash-actions{max-width:1050px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dash-card{min-height:155px;text-align:left;border:1px solid #e7e1ed;border-radius:17px;background:#fff;padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;box-shadow:0 4px 16px #30234108;color:#302a3b}
.dash-card:hover{border-color:#c7b5e8;transform:translateY(-2px)}
.dash-card strong{font-size:15px;margin-top:8px}.dash-card small{font-size:12px;color:#8b8495}
.dash-icon,.recent-icon{width:38px;height:38px;border-radius:12px;background:#f1ebfb;color:#704db6;display:grid;place-items:center}
.new-board .dash-icon{background:#fff0e6;color:#e67b37}
.dash-section{max-width:1050px;margin:34px auto 0}.dash-section h2{font-size:17px;margin:0;color:#302a3b}

.recent-board>div{display:flex;flex-direction:column;gap:4px;flex:1}.recent-board strong{font-size:13px}.recent-board small{font-size:11px;color:#8b8495}
.recent-board button{border:0;background:#f3eefb;color:#6948aa;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
.dash-footer{max-width:1050px;margin:28px auto 0;display:flex;justify-content:space-between;color:#a09aaa;font-size:11px}.dash-mark{display:flex;align-items:center;gap:5px;color:#766b89}
@media(max-width:700px){.dashboard{inset:54px 0 49px;padding:20px 14px}.dash-actions{grid-template-columns:1fr;gap:9px}.dash-card{min-height:95px;padding:14px}.dash-top{margin-bottom:20px}.dash-footer{gap:12px;flex-wrap:wrap}.floatbar,.floatbar.right{left:7px;width:50px;padding:7px 4px}.tbtn{width:38px;height:36px}.palette{gap:5px}.swatch{width:15px;height:15px}.view-switch{font-size:0;gap:0}.view-switch .mi{font-size:19px}}
@media(max-width:430px){.brand>span{display:none}#dashboardBtn{font-size:0}#dashboardBtn .mi{font-size:19px}.header-tools{gap:4px}}

#dashboard[hidden]{display:none!important}
.dash-library{max-width:1050px;margin:22px auto 0}.dash-library-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dash-library-actions{display:flex;gap:8px}.dash-library-actions button,.file-action{border:1px solid #e5e1eb;background:#fff;border-radius:9px;padding:9px 12px;font-size:12px;color:#504b5c}

/* Full-canvas whiteboard with a single draggable radial control dock */
html,body,#app{background:#fff}
#app{position:relative}
#workspace{position:absolute;inset:0;padding:0!important;margin:0!important;gap:0!important;background:#fff}
.pane{border:0!important;border-radius:0!important}
#pane-right{border-left:2px dotted #d7d1df!important}
#workspace.is-split{padding:0!important}
#workspace.is-split::after{display:none}
header{display:none!important}
.bottom{position:fixed;z-index:25;left:50%;bottom:9px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);height:44px;padding:4px 9px;border:1px solid #e9e4ef;border-radius:16px;background:#ffffffdf;backdrop-filter:blur(14px);box-shadow:0 5px 22px #2c21421c;gap:7px}
.pagebtn{height:30px;min-width:30px}.pagechip{height:31px;min-width:36px}
.control-dock{position:fixed;z-index:230;top:13px;right:14px;display:flex;align-items:flex-start;justify-content:flex-end;touch-action:none}
.dock-orb{width:48px;height:48px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#ff9d42 0%,#ed6395 48%,#7552d5 100%);box-shadow:0 5px 20px #9b5bd64a,0 0 0 5px #ffffffc9;cursor:grab;touch-action:none;user-select:none}
.dock-orb:active{cursor:grabbing}.dock-orb .mi{font-size:23px}
.dock-panel{position:absolute;top:0;right:0;display:none;min-width:250px;padding:60px 12px 12px;border:1px solid #eadff2;border-radius:25px;background:linear-gradient(145deg,#fff9f1f5,#fbf5fff5 55%,#f1f8fff5);box-shadow:0 12px 38px #30213d2b;backdrop-filter:blur(18px);gap:7px;flex-direction:column;transform-origin:top right;animation:dock-pop .18s ease-out}
.control-dock.open .dock-panel{display:flex}
.control-dock.open .dock-orb{position:relative;z-index:2}
@keyframes dock-pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.dock-panel .headbtn{width:100%;min-height:39px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;background:#ffffffdc;font-size:12px}
.dock-panel .headbtn .mi{font-size:18px}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='rohan-promethean-whiteboard-v5';
const sides=['left','right'];
const fresh=()=>({strokes:[],undo:[],redo:[],zoom:1,panX:0,panY:0,tool:'pen',color:'#252333',width:4,eraser:24,bg:'grid'});
const state={left:{pages:[fresh()],index:0},right:{pages:[fresh()],index:0}};
const canv={},ctx={},activePointers={left:new Map(),right:new Map()};
let split=false,library=[],activeFileId='';
const clone=o=>JSON.parse(JSON.stringify(o));
const makeId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function activeFile(){return library.find(f=>f.id===activeFileId&&f.kind==='board')}
function syncActiveFile(){const f=activeFile();if(f){f.data={state:clone(state),split};f.updated=Date.now()}}
function page(s){return state[s].pages[state[s].index]}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1800)}
function save(){try{syncActiveFile();localStorage.setItem(KEY+'-library',JSON.stringify(library));localStorage.setItem(KEY+'-active',activeFileId);localStorage.setItem(KEY,JSON.stringify({state,split}))}catch(e){toast('Could not save: browser storage is full')}}
function load(){try{
 const saved=JSON.parse(localStorage.getItem(KEY+'-library')||'null');if(Array.isArray(saved))library=saved;
 if(!library.length){const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.state)library.push({id:makeId(),kind:'board',name:localStorage.getItem(KEY+'-name')||'Untitled board',folderId:null,updated:Date.now(),data:old})}
 if(!library.some(f=>f.kind==='board'))library.push({id:makeId(),kind:'board',name:'Untitled whiteboard',folderId:null,updated:Date.now(),data:{state:clone(state),split:false}});
 activeFileId=localStorage.getItem(KEY+'-active')||library.find(f=>f.kind==='board').id;
 let f=activeFile();if(!f){f=library.find(x=>x.kind==='board');activeFileId=f.id}
 if(f.data&&f.data.state){sides.forEach(s=>{if(f.data.state[s])state[s]=f.data.state[s]});split=!!f.data.split}
 }catch(e){library=[{id:makeId(),kind:'board',name:'Untitled whiteboard',folderId:null,data:{state:clone(state),split:false}}];activeFileId=library[0].id;split=false}
}
function snapshot(s){const p=page(s);p.undo.push(JSON.stringify(p.strokes));if(p.undo.length>80)p.undo.shift();p.redo=[]}
function drawStroke(c,st){if(!st.points?.length)return;c.save();c.globalCompositeOperation=st.tool==='eraser'?'destination-out':'source-over';c.globalAlpha=st.tool==='highlighter'?.28:1;c.strokeStyle=st.color;c.lineWidth=st.tool==='eraser'?st.width:st.tool==='highlighter'?Math.max(st.width,13):st.width;c.lineCap=st.tool==='highlighter'?'square':'round';c.lineJoin='round';c.beginPath();c.moveTo(st.points[0].x,st.points[0].y);if(st.points.length===1)c.lineTo(st.points[0].x+.1,st.points[0].y+.1);else st.points.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.stroke();c.restore()}
function paintBackground(s){const c=ctx[s],w=canv[s].width,h=canv[s].height,d=window.devicePixelRatio||1,p=page(s);c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,w,h);c.restore();c.setTransform(d*p.zoom,0,0,d*p.zoom,d*p.panX,d*p.panY);const scale=d*p.zoom;c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,w,h);c.restore();if(p.bg!=='plain'){const gap=(p.bg==='lined'?34:p.bg==='dots'?24:28)*scale;c.save();c.strokeStyle=p.bg==='lined'?'#dce7f5':'#e9e5ef';c.fillStyle='#e3deea';c.lineWidth=1;const ox=((p.panX*scale)%gap+gap)%gap,oy=((p.panY*scale)%gap+gap)%gap;if(p.bg==='dots'){for(let x=ox;x<w;x+=gap)for(let y=oy;y<h;y+=gap){c.beginPath();c.arc(x,y,1.1,0,Math.PI*2);c.fill()}}else if(p.bg==='lined'){for(let y=oy;y<h;y+=gap){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}else{for(let x=ox;x<w;x+=gap){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=oy;y<h;y+=gap){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}c.restore()}p.strokes.forEach(st=>drawStroke(c,st));c.setTransform(d,0,0,d,0,0)}
function resize(s){const r=canv[s].getBoundingClientRect(),d=Math.min(3,window.devicePixelRatio||1);if(!r.width||!r.height)return;const w=Math.round(r.width*d),h=Math.round(r.height*d);if(canv[s].width!==w||canv[s].height!==h){canv[s].width=w;canv[s].height=h}paintBackground(s)}
function pos(s,e){const r=canv[s].getBoundingClientRect(),p=page(s);return{x:(e.clientX-r.left-p.panX)/p.zoom,y:(e.clientY-r.top-p.panY)/p.zoom}}
function setTool(s,t){page(s).tool=t;document.querySelectorAll('[data-side="'+s+'"][data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('ruler-'+s).classList.toggle('visible',t==='ruler');save()}
function redraw(s){paintBackground(s)}
function start(s,e){const p=page(s),tool=p.tool;if(e.button!==undefined&&e.button!==0)return;if(tool==='ruler')return;const point=pos(s,e);if(tool==='pan'||e.button===1){activePointers[s].set(e.pointerId,{pan:true,x:e.clientX,y:e.clientY,px:p.panX,py:p.panY});canv[s].setPointerCapture(e.pointerId);e.preventDefault();return}const st={tool,color:p.color,width:tool==='eraser'?p.eraser:p.width,points:[point]};snapshot(s);activePointers[s].set(e.pointerId,{st,last:point});canv[s].setPointerCapture(e.pointerId);drawStroke(ctx[s],st);e.preventDefault()}
function move(s,e){const a=activePointers[s].get(e.pointerId);if(!a)return;const p=page(s);if(a.pan){p.panX=a.px+(e.clientX-a.x);p.panY=a.py+(e.clientY-a.y);redraw(s);e.preventDefault();return}const point=pos(s,e);a.st.points.push(point);if(a.st.tool==='ruler'){redraw(s);drawStroke(ctx[s],{...a.st,points:[a.st.points[0],point]})}else{const last=a.last;a.last=point;drawStroke(ctx[s],{...a.st,points:[last,point]})}e.preventDefault()}
function end(s,e){const a=activePointers[s].get(e.pointerId);if(!a)return;activePointers[s].delete(e.pointerId);if(a.st){if(a.st.tool==='ruler')a.st.points=[a.st.points[0],a.last||a.st.points.at(-1)];page(s).strokes.push(a.st);redraw(s);renderPages();save()}}
function undo(s){const p=page(s);if(!p.undo.length)return toast('Nothing to undo');p.redo.push(JSON.stringify(p.strokes));p.strokes=JSON.parse(p.undo.pop());redraw(s);renderPages();save()}
function clear(s){const p=page(s);if(!p.strokes.length)return;snapshot(s);p.strokes=[];redraw(s);renderPages();save()}
function renderPages(){const el=$('pages');el.innerHTML='';const list=state.left.pages;list.forEach((p,i)=>{const b=document.createElement('button');b.className='pagechip'+(i===state.left.index?' active':'');b.textContent=''+(i+1);b.onclick=()=>{state.left.index=i;state.right.index=Math.min(i,state.right.pages.length-1);sides.forEach(redraw);renderPages();save()};el.append(b)});$('pageCount').textContent='Page '+(state.left.index+1)+' of '+list.length}
function addPage(){sides.forEach(s=>{const p=fresh();state[s].pages.splice(state[s].index+1,0,p);state[s].index++});sides.forEach(redraw);renderPages();save()}
function setSplit(v){split=v;$('pane-right').hidden=!v;$('splitBtn').innerHTML=v?'<span class="mi">splitscreen</span> Single view':'<span class="mi">splitscreen</span> Split view';$('splitBtn').title=v?'Switch to single view':'Switch to split view';$('workspace').classList.toggle('is-split',v);$('pane-left').querySelector('.pane-label').textContent=v?'WHITEBOARD 1 · LEFT':'WHITEBOARD';requestAnimationFrame(()=>sides.forEach(s=>{resize(s);redraw(s)}));save()}
function updateZoom(){const z=page('left').zoom;$('zoomRead').textContent=Math.round(z*100)+'%'}
function zoom(f){sides.forEach(s=>{const p=page(s);p.zoom=Math.max(.25,Math.min(3,p.zoom*f));redraw(s)});updateZoom();save()}
sides.forEach(s=>{canv[s]=$('canvas-'+s);ctx[s]=canv[s].getContext('2d');canv[s].addEventListener('pointerdown',e=>start(s,e));canv[s].addEventListener('pointermove',e=>move(s,e));['pointerup','pointercancel','lostpointercapture'].forEach(n=>canv[s].addEventListener(n,e=>end(s,e)));new ResizeObserver(()=>resize(s)).observe(canv[s].parentElement)});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.side,b.dataset.tool));
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{const s=b.closest('[data-palette]').dataset.palette;page(s).color=b.dataset.color;b.parentElement.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('selected',x===b));save()});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const s=b.dataset.side;if(b.dataset.action==='undo')undo(s);if(b.dataset.action==='clear'){clear(s);toast('Drawings cleared')}});
function closePopups(except=null){
 document.querySelectorAll('.size-pop').forEach(p=>{
  if(p!==except){p.classList.remove('open');p.style.left='';p.style.top=''}
 });
 document.querySelectorAll('[data-action="size"]').forEach(b=>{
  if(!except || b.dataset.side !== except.id.replace('size-','')) b.setAttribute('aria-expanded','false');
 });
}
function placeSizePopup(side,pop){
 const trigger=document.querySelector('[data-side="'+side+'"][data-action="size"]');
 const r=trigger.getBoundingClientRect(),w=220,h=pop.offsetHeight||130;
 const left=Math.max(12,Math.min(window.innerWidth-w-12,r.left+r.width/2-w/2));
 const above=r.top-h-10;
 const top=above>=10?above:Math.min(window.innerHeight-h-10,r.bottom+10);
 pop.style.left=left+'px';pop.style.top=Math.max(10,top)+'px';
}
document.querySelectorAll('[data-action="size"]').forEach(b=>{
 b.setAttribute('aria-haspopup','true');
 b.setAttribute('aria-expanded','false');
 b.addEventListener('click',e=>{
  e.stopPropagation();
  const s=b.dataset.side,pop=$('size-'+s),willOpen=!pop.classList.contains('open');
  closePopups(pop);
  pop.classList.toggle('open',willOpen);
  b.setAttribute('aria-expanded',String(willOpen));
  if(willOpen) requestAnimationFrame(()=>placeSizePopup(s,pop));
 });
});
document.querySelectorAll('.size-pop').forEach(pop=>{
 pop.addEventListener('pointerdown',e=>e.stopPropagation());
 pop.addEventListener('click',e=>e.stopPropagation());
 pop.addEventListener('input',e=>e.stopPropagation());
});
window.addEventListener('resize',()=>document.querySelectorAll('.size-pop.open').forEach(pop=>placeSizePopup(pop.id.replace('size-',''),pop)));
window.addEventListener('scroll',()=>document.querySelectorAll('.size-pop.open').forEach(pop=>placeSizePopup(pop.id.replace('size-',''),pop)),true);
document.addEventListener('pointerdown',e=>{
 if(!e.target.closest('.floatbar'))closePopups();
 if(!e.target.closest('#backgroundBtn')&&!e.target.closest('#backgroundMenu'))$('backgroundMenu').classList.remove('open');
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closePopups();$('backgroundMenu').classList.remove('open');dock.classList.remove('open');orb.setAttribute('aria-expanded','false')}
});
document.querySelectorAll('[data-width]').forEach(i=>i.oninput=()=>{const s=i.dataset.width;page(s).width=+i.value;$('width-'+s).textContent=i.value;save()});
document.querySelectorAll('[data-erase]').forEach(i=>i.oninput=()=>{const s=i.dataset.erase;page(s).eraser=+i.value;$('erase-'+s).textContent=i.value;save()});
function dragBar(s){const bar=$('bar-'+s),grip=bar.querySelector('.grip');let drag=null;grip.addEventListener('pointerdown',e=>{const r=bar.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};grip.setPointerCapture(e.pointerId);e.preventDefault()});grip.addEventListener('pointermove',e=>{if(!drag)return;const pane=$('pane-'+s).getBoundingClientRect();const x=Math.max(0,Math.min(pane.width-bar.offsetWidth,e.clientX-pane.left-drag.x)),y=Math.max(0,Math.min(pane.height-bar.offsetHeight,e.clientY-pane.top-drag.y));bar.style.left=x+'px';bar.style.right='auto';bar.style.top=y+'px';bar.style.transform='none'});['pointerup','pointercancel'].forEach(n=>grip.addEventListener(n,()=>drag=null))}
sides.forEach(dragBar);
function setupRuler(s){
 const ruler=$('ruler-'+s),paneEl=$('pane-'+s),edge=ruler.querySelector('.ruler-edge');
 let moving=null,line=null;
 ruler.addEventListener('pointerdown',e=>{
  if(page(s).tool!=='ruler'||e.target===edge)return;
  const pr=paneEl.getBoundingClientRect(),r=ruler.getBoundingClientRect();
  moving={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top};
  ruler.style.transform='none';ruler.style.left=(r.left-pr.left)+'px';ruler.style.top=(r.top-pr.top)+'px';
  ruler.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();
 });
 ruler.addEventListener('pointermove',e=>{
  if(!moving||moving.id!==e.pointerId)return;
  const pr=paneEl.getBoundingClientRect();
  const x=Math.max(0,Math.min(pr.width-ruler.offsetWidth,e.clientX-pr.left-moving.dx));
  const y=Math.max(0,Math.min(pr.height-ruler.offsetHeight,e.clientY-pr.top-moving.dy));
  ruler.style.left=x+'px';ruler.style.top=y+'px';e.preventDefault();
 });
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>ruler.addEventListener(n,e=>{if(moving&&moving.id===e.pointerId)moving=null}));
 edge.addEventListener('pointerdown',e=>{
  if(page(s).tool!=='ruler')return;
  e.preventDefault();e.stopPropagation();
  const p=pos(s,e);line={id:e.pointerId,start:{x:p.x,y:p.y},last:{x:p.x,y:p.y}};
  snapshot(s);edge.setPointerCapture(e.pointerId);
 });
 window.addEventListener('pointermove',e=>{
  if(!line||line.id!==e.pointerId)return;
  const p=pos(s,e);line.last={x:p.x,y:line.start.y};
  redraw(s);drawStroke(ctx[s],{tool:'pen',color:page(s).color,width:page(s).width,points:[line.start,line.last]});
  e.preventDefault();
 },{passive:false});
 function finish(e){
  if(!line||line.id!==e.pointerId)return;
  const st={tool:'pen',color:page(s).color,width:page(s).width,points:[line.start,line.last]};
  page(s).strokes.push(st);line=null;redraw(s);renderPages();save();
 }
 window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',finish);
}
sides.forEach(setupRuler);
$('splitBtn').onclick=()=>setSplit(!split);

const dock=$('controlDock'),orb=$('dockOrb'),dockPanel=$('dockPanel');
let dockDrag=null,dockMoved=false;
orb.addEventListener('pointerdown',e=>{const r=dock.getBoundingClientRect();dockDrag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,x:e.clientX,y:e.clientY};dockMoved=false;orb.setPointerCapture(e.pointerId);e.preventDefault()});
orb.addEventListener('pointermove',e=>{if(!dockDrag||dockDrag.id!==e.pointerId)return;const dx=e.clientX-dockDrag.x,dy=e.clientY-dockDrag.y;if(Math.abs(dx)+Math.abs(dy)>5)dockMoved=true;if(dockMoved){const x=Math.max(4,Math.min(innerWidth-dock.offsetWidth-4,e.clientX-dockDrag.dx));const y=Math.max(4,Math.min(innerHeight-orb.offsetHeight-4,e.clientY-dockDrag.dy));dock.style.left=x+'px';dock.style.top=y+'px';dock.style.right='auto';dock.style.bottom='auto';e.preventDefault()}});
function releaseDock(e){if(!dockDrag||dockDrag.id!==e.pointerId)return;dockDrag=null;if(!dockMoved){const open=!dock.classList.contains('open');dock.classList.toggle('open',open);orb.setAttribute('aria-expanded',String(open));dockPanel.setAttribute('aria-hidden',String(!open))}}
['pointerup','pointercancel','lostpointercapture'].forEach(n=>orb.addEventListener(n,releaseDock));
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#controlDock')){dock.classList.remove('open');orb.setAttribute('aria-expanded','false');dockPanel.setAttribute('aria-hidden','true')}});

function openDashboard(){$('dashboard').hidden=false;$('dashboard').classList.add('is-open');renderLibrary();}
function closeDashboard(){$('dashboard').hidden=true;$('dashboard').classList.remove('is-open');}
$('dashboardBtn').onclick=openDashboard;$('dashboardClose').onclick=closeDashboard;$('continueBoard').onclick=closeDashboard;
function renderLibrary(){
 const el=$('libraryList');if(!el)return;el.innerHTML='';
 const folders=library.filter(f=>f.kind==='folder'),boards=library.filter(f=>f.kind==='board');
 function row(f){const r=document.createElement('div');r.className='library-row'+(f.kind==='folder'?' folder':'');
 const glyph=document.createElement('span');glyph.className='file-glyph';glyph.innerHTML='<span class="mi">'+(f.kind==='folder'?'folder':'description')+'</span>';
 const meta=document.createElement('div');meta.className='file-meta';const title=document.createElement('strong');title.textContent=f.name;const sub=document.createElement('small');sub.textContent=f.kind==='folder'?boards.filter(b=>b.folderId===f.id).length+' whiteboards':(f.data?.state?.left?.pages?.length||1)+' pages';meta.append(title,sub);
 const actions=document.createElement('div');actions.className='file-actions';
 function act(label,icon,fn){const b=document.createElement('button');b.className='file-action';b.title=label;b.innerHTML='<span class="mi">'+icon+'</span>';b.onclick=fn;actions.append(b)}
 if(f.kind==='board')act('Open','open_in_new',()=>openFile(f.id));
 act('Rename','drive_file_rename_outline',()=>renameFile(f.id));
 if(f.kind==='board')act('Move to folder','folder',()=>moveFile(f.id));
 act('Delete','delete',()=>deleteFile(f.id));r.append(glyph,meta,actions);el.append(r)}
 folders.forEach(row);boards.filter(b=>!b.folderId||!folders.some(f=>f.id===b.folderId)).forEach(row);
 folders.forEach(f=>boards.filter(b=>b.folderId===f.id).forEach(row));
 if(!el.children.length)el.innerHTML='<div class="library-empty">No files yet. Create a whiteboard to get started.</div>';
}
function openFile(id){const f=library.find(x=>x.id===id&&x.kind==='board');if(!f)return;syncActiveFile();activeFileId=id;sides.forEach(s=>{state[s]=clone(f.data.state[s]||{pages:[fresh()],index:0})});split=!!f.data.split;closeDashboard();$('projectName').textContent=f.name+' ▾';setSplit(split);sides.forEach(s=>{const p=page(s);$('width-'+s).textContent=p.width;$('erase-'+s).textContent=p.eraser;setTool(s,p.tool)});renderPages();updateZoom();save();toast('Opened '+f.name)}
function createBoard(){syncActiveFile();const f={id:makeId(),kind:'board',name:'Untitled whiteboard',folderId:null,updated:Date.now(),data:{state:{left:{pages:[fresh()],index:0},right:{pages:[fresh()],index:0}},split:false}};library.push(f);activeFileId=f.id;sides.forEach(s=>{state[s]=clone(f.data.state[s])});split=false;$('projectName').textContent=f.name+' ▾';setSplit(false);sides.forEach(redraw);renderPages();updateZoom();save();closeDashboard();toast('New whiteboard created')}
function renameFile(id){const f=library.find(x=>x.id===id);if(!f)return;const n=prompt('Enter a new name',f.name);if(!n||!n.trim())return;f.name=n.trim();if(id===activeFileId)$('projectName').textContent=f.name+' ▾';save();renderLibrary()}
function moveFile(id){const f=library.find(x=>x.id===id&&x.kind==='board');if(!f)return;const folders=library.filter(x=>x.kind==='folder');if(!folders.length){toast('Create a folder first');return}const choices=['No folder',...folders.map(x=>x.name)];const pick=prompt('Choose destination number:\n'+choices.map((x,i)=>(i+1)+'. '+x).join('\n'),'1');if(pick===null)return;const n=Number(pick);if(!Number.isInteger(n)||n<1||n>choices.length)return toast('Invalid folder number');f.folderId=n===1?null:folders[n-2].id;save();renderLibrary()}
function deleteFile(id){const f=library.find(x=>x.id===id);if(!f||!confirm('Delete '+f.name+'?'))return;if(f.kind==='folder')library.filter(x=>x.kind==='board'&&x.folderId===id).forEach(b=>b.folderId=null);library=library.filter(x=>x.id!==id);if(id===activeFileId){const next=library.find(x=>x.kind==='board');if(next){activeFileId=next.id;const data=next.data.state;sides.forEach(s=>state[s]=clone(data[s]||{pages:[fresh()],index:0}));split=!!next.data.split;$('projectName').textContent=next.name+' ▾';setSplit(split);renderPages();updateZoom()}else{createBoard()}}save();renderLibrary()}
$('addFolder').onclick=()=>{const n=prompt('Name this folder');if(!n||!n.trim())return;library.push({id:makeId(),kind:'folder',name:n.trim(),updated:Date.now()});save();renderLibrary()};
$('newBoardFile').onclick=createBoard;$('newBoard').onclick=createBoard;
$('dashboardSplit').onclick=()=>{setSplit(true);closeDashboard()};
$('newBoard').onclick=createBoard;$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('zoomRead').onclick=()=>{sides.forEach(s=>{page(s).zoom=1;page(s).panX=0;page(s).panY=0;redraw(s)});updateZoom();save()};
$('backgroundBtn').onclick=e=>{
 e.stopPropagation();
 const menu=$('backgroundMenu'),r=$('backgroundBtn').getBoundingClientRect();
 menu.style.left=Math.max(8,Math.min(window.innerWidth-210,r.left))+'px';
 menu.style.top=Math.min(window.innerHeight-170,r.bottom+8)+'px';
 menu.classList.toggle('open');
};
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{sides.forEach(s=>{page(s).bg=b.dataset.bg;redraw(s)});$('backgroundMenu').classList.remove('open');save()});
document.addEventListener('click',e=>{if(!e.target.closest('#backgroundBtn')&&!e.target.closest('#backgroundMenu'))$('backgroundMenu').classList.remove('open')});
$('add').onclick=addPage;$('prev').onclick=()=>{state.left.index=Math.max(0,state.left.index-1);state.right.index=Math.min(state.left.index,state.right.pages.length-1);sides.forEach(redraw);renderPages();save()};$('next').onclick=()=>{state.left.index=Math.min(state.left.pages.length-1,state.left.index+1);state.right.index=Math.min(state.left.index,state.right.pages.length-1);sides.forEach(redraw);renderPages();save()};
$('saveBtn').onclick=()=>{save();toast('Board saved on this device')};
$('exportBtn').onclick=()=>{const s='left',a=document.createElement('a');a.download='whiteboard.png';a.href=canv[s].toDataURL('image/png');a.click()};
$('projectName').onclick=()=>renameFile(activeFileId);
load();const savedName=activeFile()?.name||'Untitled whiteboard';$('projectName').textContent=savedName+' ▾';
sides.forEach(s=>{const p=page(s);$('width-'+s).textContent=p.width;$('erase-'+s).textContent=p.eraser;document.querySelector('[data-width="'+s+'"]').value=p.width;document.querySelector('[data-erase="'+s+'"]').value=p.eraser;document.querySelectorAll('[data-palette="'+s+'"] .swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color===p.color));setTool(s,p.tool)});
openDashboard();setSplit(split);requestAnimationFrame(()=>sides.forEach(resize));renderPages();updateZoom();
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dashboard').hidden){closeDashboard();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo('left')}if(e.key==='Escape')document.querySelectorAll('.size-pop').forEach(x=>x.classList.remove('open'))});
})();
</script>
</body>
