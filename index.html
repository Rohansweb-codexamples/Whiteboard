<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#252a31"><title>Rohan's Interactive Whiteboard</title>
<style>
:root{--dark:#252a31;--dark2:#343b45;--orange:#f28a22;--paper:#fff;--line:#d8dce1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#20252c;background:#e8eaed}button{font:inherit;cursor:pointer;touch-action:manipulation}
.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;flex:none;background:var(--dark);color:#fff;display:flex;align-items:center;gap:12px;padding:0 15px;box-shadow:0 2px 8px #0003;z-index:5}.brand{font-size:16px;font-weight:800;white-space:nowrap}.mark{width:34px;height:34px;border-radius:8px;background:var(--orange);display:grid;place-items:center;font-size:21px;font-weight:900}.spacer{flex:1}.title{background:#3b424c;border:1px solid #505965;border-radius:6px;color:white;padding:8px;width:165px;outline:none}.top button{border:1px solid #59616d;background:#3b424c;color:#fff;border-radius:7px;padding:8px 11px;font-size:12px;font-weight:700}.top button:hover{background:#505966}.top button.active,.top button.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.tools{height:62px;flex:none;background:#fff;border-bottom:1px solid #d4d8dd;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;overflow-x:auto;z-index:4}.tool{height:44px;min-width:47px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:#fff;color:#48515d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;flex:none}.tool .ico{font-size:20px;line-height:20px}.tool:hover{background:#fff5eb;border-color:#f4d1ad}.tool.active{background:#ffead7;border-color:#f2b36e;color:#a64d00}.sep{height:32px;width:1px;background:#e0e3e7;margin:0 4px;flex:none}
.workspace{display:flex;flex:1;min-height:0;gap:8px;padding:8px;background:#dfe2e6}.pane{position:relative;flex:1;min-width:0;min-height:0;background:#fff;border:1px solid #cbd0d6;border-radius:7px;overflow:hidden;box-shadow:0 2px 6px #20263012}.panehead{height:29px;background:#f4f5f6;border-bottom:1px solid #e0e3e7;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:800;color:#66707b}.surface{position:absolute;inset:29px 0 0;touch-action:none;overflow:hidden;background:#fff;cursor:crosshair}.surface canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#a2a8b0;text-align:center;pointer-events:none;font-size:13px}.hint b{display:block;color:#818995;font-size:18px;margin-bottom:5px}
.floatpalette{position:absolute;z-index:3;top:42px;left:12px;width:190px;background:#fff;border:1px solid #cfd4da;border-radius:10px;box-shadow:0 5px 20px #0002;padding:8px;touch-action:none}.floatpalette.right{left:auto;right:12px}.draghead{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;color:#515a65;padding:3px 3px 8px;cursor:grab}.draghead:active{cursor:grabbing}.draghead span:last-child{font-weight:400;color:#9299a2}.palettecolors{display:flex;gap:7px;flex-wrap:wrap;padding:2px 3px 8px}.dot{width:23px;height:23px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #bbc1c9}.dot.selected{box-shadow:0 0 0 2px var(--orange)}.palbottom{display:flex;align-items:center;gap:7px;font-size:10px;color:#626b76}.palbottom input{width:100%;accent-color:var(--orange)}
.footer{height:38px;flex:none;background:#252a31;color:#c9cdd2;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:11px}.footer button{border:0;background:transparent;color:#fff;font-size:11px;padding:6px}.footer button:hover{color:#ffb66b}
@media(max-width:650px){.top{height:52px;padding:0 7px;gap:6px}.brand{font-size:12px}.mark{width:29px;height:29px}.title{display:none}.top button{padding:7px;font-size:10px}.tools{height:58px;justify-content:flex-start}.tool{min-width:43px;height:42px}.workspace{padding:4px;gap:4px}.panehead{height:24px}.surface{inset:24px 0 0}.floatpalette{width:140px;top:32px;padding:5px}.dot{width:19px;height:19px}.draghead{font-size:10px}.footer{height:33px}}
</style></head>
<body><div class="app">
<header class="top"><div class="mark">W</div><div class="brand">Interactive Whiteboard</div><input id="title" class="title" value="Untitled lesson" aria-label="Board title"><div class="spacer"></div><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="clear">Clear page</button><button id="split">Split screen</button><button id="full" class="primary">⛶ Fullscreen</button></header>
<nav class="tools" aria-label="Whiteboard tools">
<button class="tool active" data-tool="pen"><span class="ico">✎</span>Pen</button><button class="tool" data-tool="highlighter"><span class="ico">▰</span>Highlighter</button><button class="tool" data-tool="eraser"><span class="ico">▱</span>Eraser</button><span class="sep"></span>
<button class="tool" data-tool="line"><span class="ico">／</span>Line</button><button class="tool" data-tool="arrow"><span class="ico">➜</span>Arrow</button><button class="tool" data-tool="rect"><span class="ico">□</span>Rectangle</button><button class="tool" data-tool="circle"><span class="ico">○</span>Circle</button><button class="tool" data-tool="triangle"><span class="ico">△</span>Triangle</button><span class="sep"></span>
<button class="tool" data-tool="text"><span class="ico">T</span>Text</button><button class="tool" data-tool="sticky"><span class="ico">▧</span>Note</button><button class="tool" data-tool="laser"><span class="ico">⌁</span>Laser</button><span class="sep"></span>
<button class="tool" id="imageBtn"><span class="ico">▣</span>Picture</button><input id="imageFile" type="file" accept="image/*" hidden>
</nav>
<main class="workspace" id="workspace">
<section class="pane" data-side="0"><div class="panehead">BOARD 1</div><div class="surface"><canvas></canvas><div class="hint"><b>Board 1</b>Write or draw here</div></div><div class="floatpalette" data-palette="0"><div class="draghead"><span>✥ PEN CHANGER — 1</span><span>DRAG</span></div><div class="palettecolors"><button class="dot selected" data-color="#20242b" style="background:#20242b"></button><button class="dot" data-color="#e53935" style="background:#e53935"></button><button class="dot" data-color="#1976d2" style="background:#1976d2"></button><button class="dot" data-color="#159447" style="background:#159447"></button><button class="dot" data-color="#f3c623" style="background:#f3c623"></button><button class="dot" data-color="#ef7b18" style="background:#ef7b18"></button><button class="dot" data-color="#8b4acb" style="background:#8b4acb"></button><button class="dot" data-color="#fff" style="background:#fff"></button></div><div class="palbottom">Pen size <input type="range" min="2" max="30" value="5" data-size="0"><b data-size-label="0">5</b></div></div></section>
<section class="pane" data-side="1" hidden><div class="panehead">BOARD 2</div><div class="surface"><canvas></canvas><div class="hint"><b>Board 2</b>Write or draw here</div></div><div class="floatpalette right" data-palette="1"><div class="draghead"><span>✥ PEN CHANGER — 2</span><span>DRAG</span></div><div class="palettecolors"><button class="dot selected" data-color="#20242b" style="background:#20242b"></button><button class="dot" data-color="#e53935" style="background:#e53935"></button><button class="dot" data-color="#1976d2" style="background:#1976d2"></button><button class="dot" data-color="#159447" style="background:#159447"></button><button class="dot" data-color="#f3c623" style="background:#f3c623"></button><button class="dot" data-color="#ef7b18" style="background:#ef7b18"></button><button class="dot" data-color="#8b4acb" style="background:#8b4acb"></button><button class="dot" data-color="#fff" style="background:#fff"></button></div><div class="palbottom">Pen size <input type="range" min="2" max="30" value="5" data-size="1"><b data-size-label="1">5</b></div></div></section>
</main>
<footer class="footer"><span id="modeLabel">Single board mode</span><span><button id="newPage">New page</button><button id="save">Save</button><button id="export">Export PNG</button></span></footer>
</div>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const panes=$$(".pane"),boards=panes.map((pane,i)=>({pane,area:pane.querySelector(".surface"),canvas:pane.querySelector("canvas"),ctx:pane.querySelector("canvas").getContext("2d"),objects:[],history:[],redo:[],color:"#20242b",size:5,preview:null,drawing:false,start:null}));
let tool="pen",split=false,active=0,saveTimer;const cache=new Map();
function setStatus(s){$("#modeLabel").textContent=s}
function save(){try{localStorage.setItem("promethean-whiteboard",JSON.stringify({title:$("#title").value,split,boards:boards.map(b=>b.objects)}));setStatus("Saved on this device")}catch(e){setStatus("Storage full — export your board")}}
function scheduleSave(){setStatus("Saving…");clearTimeout(saveTimer);saveTimer=setTimeout(save,300)}
function resize(b){const r=b.area.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);b.canvas.width=Math.round(r.width*d);b.canvas.height=Math.round(r.height*d);b.ctx.setTransform(d,0,0,d,0,0);render(b)}
function snapshot(b){b.history.push(JSON.stringify(b.objects));if(b.history.length>60)b.history.shift();b.redo=[];updateHistory()}
function updateHistory(){$("#undo").disabled=!boards.some(b=>b.history.length);$("#redo").disabled=!boards.some(b=>b.redo.length)}
function draw(b,o,c){c.save();c.strokeStyle=o.color||"#20242b";c.fillStyle=o.color||"#20242b";c.lineWidth=o.size||5;c.lineCap="round";c.lineJoin="round";c.globalAlpha=o.alpha??1;
if(o.type==="path"){if(o.points.length){c.beginPath();c.moveTo(o.points[0].x,o.points[0].y);o.points.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.stroke()}}
if(o.type==="line"||o.type==="arrow"){c.beginPath();c.moveTo(o.x1,o.y1);c.lineTo(o.x2,o.y2);c.stroke();if(o.type==="arrow"){let a=Math.atan2(o.y2-o.y1,o.x2-o.x1),h=17;c.beginPath();c.moveTo(o.x2,o.y2);c.lineTo(o.x2-h*Math.cos(a-.5),o.y2-h*Math.sin(a-.5));c.moveTo(o.x2,o.y2);c.lineTo(o.x2-h*Math.cos(a+.5),o.y2-h*Math.sin(a+.5));c.stroke()}}
if(o.type==="rect")c.strokeRect(o.x,o.y,o.w,o.h);
if(o.type==="circle"){c.beginPath();c.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2),Math.abs(o.h/2),0,0,Math.PI*2);c.stroke()}
if(o.type==="triangle"){c.beginPath();c.moveTo(o.x+o.w/2,o.y);c.lineTo(o.x+o.w,o.y+o.h);c.lineTo(o.x,o.y+o.h);c.closePath();c.stroke()}
if(o.type==="text"){c.font="bold "+o.fontSize+"px Arial";c.textBaseline="top";c.fillText(o.text,o.x,o.y)}
if(o.type==="sticky"){c.fillStyle="#fff1a8";c.fillRect(o.x,o.y,190,130);c.fillStyle="#403b2e";c.font="17px Arial";c.textBaseline="top";let words=o.text.split(/\s+/),line="",y=o.y+12;words.forEach(w=>{let test=line?line+" "+w:w;if(c.measureText(test).width>166&&line){c.fillText(line,o.x+12,y);line=w;y+=22}else line=test});c.fillText(line,o.x+12,y)}
if(o.type==="image"){let im=cache.get(o.src);if(!im){im=new Image();cache.set(o.src,im);im.onload=()=>render(b);im.src=o.src}if(im.complete&&im.naturalWidth)c.drawImage(im,o.x,o.y,o.w,o.h)}
c.restore()}
function render(b){const r=b.area.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1),c=b.ctx;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,r.width,r.height);b.objects.forEach(o=>draw(b,o,c));if(b.preview)draw(b,b.preview,c);b.pane.querySelector(".hint").style.display=b.objects.length?"none":"block"}
function pt(b,e){const r=b.canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function down(b,e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();const p=pt(b,e);if(tool==="text"||tool==="sticky"){const val=prompt(tool==="text"?"Enter text:":"Write your note:");if(val&&val.trim()){snapshot(b);b.objects.push(tool==="text"?{type:"text",x:p.x,y:p.y,text:val,color:b.color,fontSize:Math.max(20,b.size*5)}:{type:"sticky",x:p.x,y:p.y,text:val});render(b);scheduleSave()}return}
b.drawing=true;b.start=p;b.area.setPointerCapture(e.pointerId);if(tool==="pen"||tool==="highlighter"||tool==="eraser"||tool==="laser")b.preview={type:"path",points:[p],color:tool==="eraser"?"#fff":tool==="laser"?"#e53935":b.color,size:tool==="highlighter"?b.size*3:tool==="eraser"?b.size*4:b.size,alpha:tool==="highlighter"?.3:1};else b.preview={type:tool,x:p.x,y:p.y,w:0,h:0,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:b.color,size:b.size};render(b)}
function move(b,e){if(!b.drawing)return;const p=pt(b,e);if(b.preview.type==="path")b.preview.points.push(p);else{b.preview.x2=p.x;b.preview.y2=p.y;b.preview.x=Math.min(b.start.x,p.x);b.preview.y=Math.min(b.start.y,p.y);b.preview.w=p.x-b.start.x;b.preview.h=p.y-b.start.y}render(b)}
function up(b){if(!b.drawing)return;b.drawing=false;if(b.preview){snapshot(b);b.objects.push(b.preview);b.preview=null;scheduleSave()}render(b);updateHistory()}
boards.forEach((b,i)=>{new ResizeObserver(()=>resize(b)).observe(b.area);b.area.addEventListener("pointerdown",e=>{active=i;down(b,e)});b.area.addEventListener("pointermove",e=>move(b,e));b.area.addEventListener("pointerup",()=>up(b));b.area.addEventListener("pointercancel",()=>up(b))});
$$("[data-tool]").forEach(btn=>btn.onclick=()=>{tool=btn.dataset.tool;$$("[data-tool]").forEach(x=>x.classList.toggle("active",x===btn))});
$$("[data-palette]").forEach(pal=>{const i=+pal.dataset.palette,b=boards[i];pal.querySelectorAll("[data-color]").forEach(dot=>dot.onclick=()=>{b.color=dot.dataset.color;pal.querySelectorAll(".dot").forEach(x=>x.classList.toggle("selected",x===dot))});const range=pal.querySelector("[data-size]");range.oninput=()=>{b.size=+range.value;pal.querySelector("[data-size-label]").textContent=b.size}});
$$(".draghead").forEach(head=>{let drag=null;head.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;const el=head.parentElement,r=el.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};head.setPointerCapture(e.pointerId)});head.addEventListener("pointermove",e=>{if(!drag)return;const el=head.parentElement,host=el.parentElement.getBoundingClientRect();let x=e.clientX-host.left-drag.x,y=e.clientY-host.top-drag.y;x=Math.max(0,Math.min(host.width-el.offsetWidth,x));y=Math.max(0,Math.min(host.height-el.offsetHeight,y));el.style.left=x+"px";el.style.right="auto";el.style.top=y+"px"});head.addEventListener("pointerup",()=>drag=null);head.addEventListener("pointercancel",()=>drag=null)});
$("#split").onclick=()=>{split=!split;panes[1].hidden=!split;$("#split").classList.toggle("active",split);$("#modeLabel").textContent=split?"Split screen — two independent boards":"Single board mode";boards.forEach(resize);save()};
$("#undo").onclick=()=>{const b=boards[active];if(!b.history.length)return;b.redo.push(JSON.stringify(b.objects));b.objects=JSON.parse(b.history.pop());render(b);updateHistory();scheduleSave()};
$("#redo").onclick=()=>{const b=boards[active];if(!b.redo.length)return;b.history.push(JSON.stringify(b.objects));b.objects=JSON.parse(b.redo.pop());render(b);updateHistory();scheduleSave()};
$("#clear").onclick=()=>{const b=boards[active];if(!b.objects.length||!confirm("Clear this board?"))return;snapshot(b);b.objects=[];render(b);scheduleSave()};
$("#title").oninput=scheduleSave;$("#save").onclick=save;
$("#newPage").onclick=()=>{boards.forEach(b=>{snapshot(b);b.objects=[];render(b)});scheduleSave()};
$("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();
$("#imageBtn").onclick=()=>$("#imageFile").click();
$("#imageFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const b=boards[active],w=Math.min(450,im.width),h=im.height*w/im.width;snapshot(b);b.objects.push({type:"image",src:reader.result,x:40,y:40,w,h});render(b);scheduleSave()};im.src=reader.result};reader.readAsDataURL(f);e.target.value=""};
$("#export").onclick=()=>{const b=boards[active],r=b.area.getBoundingClientRect(),out=document.createElement("canvas");out.width=r.width*2;out.height=r.height*2;const c=out.getContext("2d");c.scale(2,2);c.fillStyle="#fff";c.fillRect(0,0,r.width,r.height);b.objects.forEach(o=>draw(b,o,c));const a=document.createElement("a");a.download="whiteboard-"+(active+1)+".png";a.href=out.toDataURL();a.click()};
try{const s=JSON.parse(localStorage.getItem("promethean-whiteboard"));if(s){$("#title").value=s.title||"Untitled lesson";boards.forEach((b,i)=>b.objects=s.boards?.[i]||[]);if(s.split){split=true;panes[1].hidden=false;$("#split").classList.add("active");$("#modeLabel").textContent="Split screen — two independent boards"}}}catch(e){}
boards.forEach(render);updateHistory();
})();
</script></body></html>
