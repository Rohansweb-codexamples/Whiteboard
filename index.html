<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Whiteboard Workspace</title>
    <!-- Tailwind CSS for elegant layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        /* Elegant smooth slide transitions for toolbars snapping to edges */
        .snap-dock {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* Continuous grid texture background */
        .grid-bg {
            background-size: 32px 32px;
            background-image: linear-gradient(to right, rgba(15, 23, 42, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(15, 23, 42, 0.02) 1px, transparent 1px);
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden m-0 p-0 bg-slate-50 font-sans relative flex select-none">

    <!-- GLOBAL APBAR CONTROL HEADER -->
    <div class="absolute top-6 left-6 bg-white/80 backdrop-blur-xl shadow-lg shadow-slate-100 rounded-2xl p-1.5 flex items-center gap-1.5 border border-white/60 z-50 transition-all duration-300">
        <button id="mode-single" class="px-4 py-2 rounded-xl text-xs font-bold tracking-wide uppercase transition-all duration-300 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-95" title="Full Screen Canvas Mode">
            Single View
        </button>
        <button id="mode-split" class="px-4 py-2 rounded-xl text-xs font-bold tracking-wide uppercase transition-all duration-200 text-slate-600 hover:bg-slate-100/80 active:scale-95" title="Split Screen Dual Mode">
            Split Screen
        </button>
    </div>

    <!-- GLOBAL UTILITIES TRIGGER (TOP RIGHT PLUS BUTTON WITH GRADIENT) -->
    <button id="global-plus-trigger" class="absolute top-6 right-6 w-12 h-12 bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-purple-200 hover:scale-105 active:scale-95 transition-all duration-300 z-50" title="Workspace Layers & Utilities">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
        </svg>
    </button>

    <!-- GLOBAL ACTION MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-all duration-300">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-6 shadow-2xl max-w-sm w-full mx-4 border border-white/80 transform scale-95 transition-all duration-300" id="modal-box">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-base font-extrabold text-slate-900 tracking-tight">Workspace Layout</h3>
                <button id="modal-close" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <p class="text-xs font-medium text-slate-500 leading-relaxed mb-6">Manage structural layout presentation modes, responsive configurations, and smart snapping dock behaviors instantly.</p>
            <div class="flex flex-col gap-2.5">
                <button id="action-reset-docks" class="w-full py-3 px-4 bg-indigo-50/80 hover:bg-indigo-100/80 text-indigo-600 font-bold rounded-2xl text-xs transition-all duration-200 text-left flex items-center gap-3 active:scale-[0.99]">
                    <span class="text-sm">🔄</span> Reset Docks to Bottom Center
                </button>
                <button id="action-snap-top" class="w-full py-3 px-4 bg-slate-100/60 hover:bg-slate-100 text-slate-700 font-bold rounded-2xl text-xs transition-all duration-200 text-left flex items-center gap-3 active:scale-[0.99]">
                    <span class="text-sm">⬆️</span> Snap All Toolbars to Top Edge
                </button>
                <button id="action-snap-bottom" class="w-full py-3 px-4 bg-slate-100/60 hover:bg-slate-100 text-slate-700 font-bold rounded-2xl text-xs transition-all duration-200 text-left flex items-center gap-3 active:scale-[0.99]">
                    <span class="text-sm">⬇️</span> Snap All Toolbars to Bottom Edge
                </button>
            </div>
        </div>
    </div>

    <!-- LEFT WORKSPACE CANVAS DIVISION -->
    <div id="pane-left" class="w-full h-full relative bg-white grid-bg transition-all duration-300 ease-in-out flex flex-col">
        <div class="w-full flex-grow relative overflow-hidden">
            <canvas id="canvas-left" class="w-full h-full"></canvas>
        </div>

        <!-- Left Smart Toolbar Panel -->
        <div id="dock-left" class="snap-dock absolute bottom-8 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-xl shadow-xl shadow-slate-200/60 rounded-full px-5 py-3 flex items-center gap-4 border border-white/80 z-40 select-none max-w-[95%]">
            <!-- Position Cycle Anchor Handle -->
            <button class="cycle-position-btn text-slate-400 hover:text-slate-600 p-1.5 hover:bg-slate-50 rounded-full transition-all active:scale-90" data-side="left" title="Cycle Bar Edge Attachment">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
                </svg>
            </button>

            <button id="tool-pen-left" class="p-2.5 rounded-full transition-all duration-200 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-90" title="Pen Tool">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                </svg>
            </button>
            <button id="tool-eraser-left" class="p-2.5 rounded-full transition-all duration-200 text-slate-500 hover:bg-slate-100 active:scale-90" title="Eraser Tool">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>

            <div class="h-5 w-[1px] bg-slate-200"></div>

            <div class="flex items-center gap-2">
                <button class="swatch-left w-5 h-5 rounded-full bg-slate-900 ring-2 ring-offset-2 ring-slate-900 transition-transform active:scale-110" data-color="#0f172a"></button>
                <button class="swatch-left w-5 h-5 rounded-full bg-blue-500 transition-transform active:scale-110" data-color="#3b82f6"></button>
                <button class="swatch-left w-5 h-5 rounded-full bg-rose-500 transition-transform active:scale-110" data-color="#ef4444"></button>
                <button class="swatch-left w-5 h-5 rounded-full bg-emerald-500 transition-transform active:scale-110" data-color="#10b981"></button>
                <button class="swatch-left w-5 h-5 rounded-full bg-amber-500 transition-transform active:scale-110" data-color="#f59e0b"></button>
            </div>

            <div class="h-5 w-[1px] bg-slate-200"></div>

            <button id="clear-left" class="p-2.5 rounded-full text-rose-500 hover:bg-rose-50 transition-all active:scale-90" title="Clear Canvas Layer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- RIGHT WORKSPACE CANVAS DIVISION -->
    <div id="pane-right" class="w-1/2 h-full relative bg-white grid-bg transition-all duration-300 ease-in-out flex flex-col hidden">
        <div class="w-full flex-grow relative overflow-hidden">
            <canvas id="canvas-right" class="w-full h-full"></canvas>
        </div>

        <!-- Right Smart Toolbar Panel -->
        <div id="dock-right" class="snap-dock absolute bottom-8 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-xl shadow-xl shadow-slate-200/60 rounded-full px-5 py-3 flex items-center gap-4 border border-white/80 z-40 select-none max-w-[95%]">
            <!-- Position Cycle Anchor Handle -->
            <button class="cycle-position-btn text-slate-400 hover:text-slate-600 p-1.5 hover:bg-slate-50 rounded-full transition-all active:scale-90" data-side="right" title="Cycle Bar Edge Attachment">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
                </svg>
            </button>

            <button id="tool-pen-right" class="p-2.5 rounded-full transition-all duration-200 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-90" title="Pen Tool">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                </svg>
            </button>
            <button id="tool-eraser-right" class="p-2.5 rounded-full transition-all duration-200 text-slate-500 hover:bg-slate-100 active:scale-90" title="Eraser Tool">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>

            <div class="h-5 w-[1px] bg-slate-200"></div>

            <div class="flex items-center gap-2">
                <button class="swatch-right w-5 h-5 rounded-full bg-slate-900 ring-2 ring-offset-2 ring-slate-900 transition-transform active:scale-110" data-color="#0f172a"></button>
                <button class="swatch-right w-5 h-5 rounded-full bg-blue-500 transition-transform active:scale-110" data-color="#3b82f6"></button>
                <button class="swatch-right w-5 h-5 rounded-full bg-rose-500 transition-transform active:scale-110" data-color="#ef4444"></button>
                <button class="swatch-right w-5 h-5 rounded-full bg-emerald-500 transition-transform active:scale-110" data-color="#10b981"></button>
                <button class="swatch-right w-5 h-5 rounded-full bg-amber-500 transition-transform active:scale-110" data-color="#f59e0b"></button>
            </div>

            <div class="h-5 w-[1px] bg-slate-200"></div>

            <button id="clear-right" class="p-2.5 rounded-full text-rose-500 hover:bg-rose-50 transition-all active:scale-90" title="Clear Canvas Layer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- SCRIPT APPLICATION ARCHITECTURE CORE MATRIX -->
    <script>
        // Track ongoing drawings per context to support completely decoupled multi-touch interactions
        let activePointers = {};

        // Modal State Machine Actions
        const plusTrigger = document.getElementById('global-plus-trigger');
        const settingsModal = document.getElementById('settings-modal');
        const modalClose = document.getElementById('modal-close');
        const modalBox = document.getElementById('modal-box');

        function toggleModal(open) {
            if (open) {
                settingsModal.classList.remove('hidden');
                setTimeout(() => {
                    settingsModal.classList.remove('opacity-0');
                    modalBox.classList.remove('scale-95');
                }, 10);
            } else {
                settingsModal.classList.add('opacity-0');
                modalBox.classList.add('scale-95');
                setTimeout(() => settingsModal.classList.add('hidden'), 200);
            }
        }
        plusTrigger.addEventListener('click', () => toggleModal(true));
        modalClose.addEventListener('click', () => toggleModal(false));
        settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) toggleModal(false); });

        // Dual-View Mode Configuration Machine
        const btnSingle = document.getElementById('mode-single');
        const btnSplit = document.getElementById('mode-split');
        const paneLeft = document.getElementById('pane-left');
        const paneRight = document.getElementById('pane-right');
        let layoutMode = 'single'; 

        function updateLayoutMode(mode) {
            layoutMode = mode;
            if (mode === 'single') {
                btnSingle.className = "px-4 py-2 rounded-xl text-xs font-bold tracking-wide uppercase transition-all duration-300 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-95";
                btnSplit.className = "px-4 py-2 rounded-xl text-xs font-bold tracking-wide uppercase transition-all duration-200 text-slate-600 hover:bg-slate-100/80 active:scale-95";
                paneLeft.className = "w-full h-full relative bg-white transition-all duration-300 ease-in-out flex flex-col grid-bg";
                paneRight.classList.add('hidden');
            } else {
                btnSplit.className = "px-4 py-2 rounded-xl text-xs font-bold tracking-wide uppercase transition-all duration-300 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-95";
                btnSingle.className = "px-4 py-2 rounded-xl text-xs font-bold tracking-wide uppercase transition-all duration-200 text-slate-600 hover:bg-slate-100/80 active:scale-95";
                paneLeft.className = "w-1/2 h-full relative bg-white border-r border-dashed border-slate-200 transition-all duration-300 ease-in-out flex flex-col grid-bg";
                paneRight.classList.remove('hidden');
            }
            window.dispatchEvent(new Event('resize'));
        }
        btnSingle.addEventListener('click', () => updateLayoutMode('single'));
        btnSplit.addEventListener('click', () => updateLayoutMode('split'));

        // Magnetic Smart Dock Snap Positions Manager
        const dockLeft = document.getElementById('dock-left');
        const dockRight = document.getElementById('dock-right');
        let dockPositions = { left: 'bottom', right: 'bottom' };

        function applyDockSnapping(side, position) {
            dockPositions[side] = position;
            const targetDock = side === 'left' ? dockLeft : dockRight;

            targetDock.classList.remove('bottom-8', 'top-8', 'left-8', 'right-8', 'left-1/2', '-translate-x-1/2', 'top-1/2', '-translate-y-1/2', 'rounded-full', 'rounded-3xl', 'flex-row', 'flex-col', 'py-3', 'px-5', 'py-5', 'px-3');

            if (position === 'bottom') {
                targetDock.classList.add('bottom-8', 'left-1/2', '-translate-x-1/2', 'flex-row', 'rounded-full', 'py-3', 'px-5');
            } else if (position === 'top') {
                targetDock.classList.add('top-8', 'left-1/2', '-translate-x-1/2', 'flex-row', 'rounded-full', 'py-3', 'px-5');
            } else if (position === 'left-edge') {
                targetDock.classList.add('left-8', 'top-1/2', '-translate-y-1/2', 'flex-col', 'rounded-3xl', 'py-5', 'px-3');
            } else if (position === 'right-edge') {
                targetDock.classList.add('right-8', 'top-1/2', '-translate-y-1/2', 'flex-col', 'rounded-3xl', 'py-5', 'px-3');
            }
        }

        document.querySelectorAll('.cycle-position-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const side = btn.getAttribute('data-side');
                const order = ['bottom', 'left-edge', 'top', 'right-edge'];
                let nextIdx = (order.indexOf(dockPositions[side]) + 1) % order.length;
                applyDockSnapping(side, order[nextIdx]);
            });
        });

        document.getElementById('action-reset-docks').addEventListener('click', () => { applyDockSnapping('left', 'bottom'); applyDockSnapping('right', 'bottom'); toggleModal(false); });
        document.getElementById('action-snap-top').addEventListener('click', () => { applyDockSnapping('left', 'top'); applyDockSnapping('right', 'top'); toggleModal(false); });
        document.getElementById('action-snap-bottom').addEventListener('click', () => { applyDockSnapping('left', 'bottom'); applyDockSnapping('right', 'bottom'); toggleModal(false); });

        // Deterministic High-DPI Whiteboard Canvas Instance Engine
        function bootstrapBoard(canvasId, paneId, side) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const pane = document.getElementById(paneId);

            let activeTool = 'pen';
            let activeColor = '#0f172a';
            let strokeWidth = 4.5;

            function configureRetinaDimensions() {
                if (side === 'right' && layoutMode === 'single') return;

                const dpr = window.devicePixelRatio || 1;
                const bounds = pane.getBoundingClientRect();

                const backup = document.createElement('canvas');
                backup.width = canvas.width;
                backup.height = canvas.height;
                const backupCtx = backup.getContext('2d');
                if (canvas.width > 0 && canvas.height > 0) {
                    backupCtx.drawImage(canvas, 0, 0);
                }

                canvas.width = bounds.width * dpr;
                canvas.height = bounds.height * dpr;

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (backup.width > 0 && backup.height > 0) {
                    ctx.drawImage(backup, 0, 0, backup.width / dpr, backup.height / dpr);
                }
            }

            function fetchCoordinates(touchObject) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: touchObject.clientX - rect.left,
                    y: touchObject.clientY - rect.top
                };
            }

            // High Precision Multi-Touch Processing Trackers
            function processTouchStart(e) {
                if (e.target.closest('.snap-dock')) return;
                
                const changedTouches = e.changedTouches;
                for (let i = 0; i < changedTouches.length; i++) {
                    const touch = changedTouches[i];
                    const point = fetchCoordinates(touch);
                    
                    activePointers[touch.identifier] = {
                        lastX: point.x,
                        lastY: point.y,
                        canvasId: canvasId
                    };

                    ctx.beginPath();
                    ctx.moveTo(point.x, point.y);
                    ctx.lineWidth = activeTool === 'eraser' ? strokeWidth * 6 : strokeWidth;
                    ctx.strokeStyle = activeTool === 'eraser' ? '#ffffff' : activeColor;
                    ctx.lineTo(point.x, point.y);
                    ctx.stroke();
                }
            }

            function processTouchMove(e) {
                if (e.cancelable) e.preventDefault();
                
                const changedTouches = e.changedTouches;
                for (let i = 0; i < changedTouches.length; i++) {
                    const touch = changedTouches[i];
                    const pointerData = activePointers[touch.identifier];
                    
                    if (pointerData && pointerData.canvasId === canvasId) {
                        const point = fetchCoordinates(touch);
                        
                        ctx.beginPath();
                        ctx.moveTo(pointerData.lastX, pointerData.lastY);
                        ctx.lineTo(point.x, point.y);
                        ctx.lineWidth = activeTool === 'eraser' ? strokeWidth * 6 : strokeWidth;
                        ctx.strokeStyle = activeTool === 'eraser' ? '#ffffff' : activeColor;
                        ctx.stroke();
                        
                        pointerData.lastX = point.x;
                        pointerData.lastY = point.y;
                    }
                }
            }

            function processTouchEnd(e) {
                const changedTouches = e.changedTouches;
                for (let i = 0; i < changedTouches.length; i++) {
                    const touch = changedTouches[i];
                    if (activePointers[touch.identifier]) {
                        delete activePointers[touch.identifier];
                    }
                }
            }

            // Mouse Fallback Implementations mapped to pointer tracking object
            let isMouseDown = false;
            function processMouseDown(e) {
                if (e.target.closest('.snap-dock')) return;
                isMouseDown = true;
                const point = fetchCoordinates(e);
                
                activePointers['mouse'] = {
                    lastX: point.x,
                    lastY: point.y,
                    canvasId: canvasId
                };

                ctx.beginPath();
                ctx.moveTo(point.x, point.y);
                ctx.lineWidth = activeTool === 'eraser' ? strokeWidth * 6 : strokeWidth;
                ctx.strokeStyle = activeTool === 'eraser' ? '#ffffff' : activeColor;
                ctx.lineTo(point.x, point.y);
                ctx.stroke();
            }

            function processMouseMove(e) {
                if (!isMouseDown) return;
                const pointerData = activePointers['mouse'];
                if (pointerData && pointerData.canvasId === canvasId) {
                    const point = fetchCoordinates(e);
                    
                    ctx.beginPath();
                    ctx.moveTo(pointerData.lastX, pointerData.lastY);
                    ctx.lineTo(point.x, point.y);
                    ctx.lineWidth = activeTool === 'eraser' ? strokeWidth * 6 : strokeWidth;
                    ctx.strokeStyle = activeTool === 'eraser' ? '#ffffff' : activeColor;
                    ctx.stroke();
                    
                    pointerData.lastX = point.x;
                    pointerData.lastY = point.y;
                }
            }

            function processMouseUp() {
                isMouseDown = false;
                delete activePointers['mouse'];
            }

            canvas.addEventListener('mousedown', processMouseDown);
            canvas.addEventListener('mousemove', processMouseMove);
            window.addEventListener('mouseup', processMouseUp);

            canvas.addEventListener('touchstart', processTouchStart, { passive: false });
            canvas.addEventListener('touchmove', processTouchMove, { passive: false });
            window.addEventListener('touchend', processTouchEnd);
            window.addEventListener('touchcancel', processTouchEnd);

            document.querySelectorAll(`.swatch-${side}`).forEach(element => {
                element.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll(`.swatch-${side}`).forEach(sw => sw.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-900'));
                    element.classList.add('ring-2', 'ring-offset-2', 'ring-slate-900');
                    activeColor = element.getAttribute('data-color');
                    activeTool = 'pen';
                    document.getElementById(`tool-pen-${side}`).className = "p-2.5 rounded-full transition-all duration-200 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-90";
                    document.getElementById(`tool-eraser-${side}`).className = "p-2.5 rounded-full transition-all duration-200 text-slate-500 hover:bg-slate-100 active:scale-90";
                });
            });

            const penBtn = document.getElementById(`tool-pen-${side}`);
            const eraserBtn = document.getElementById(`tool-eraser-${side}`);

            penBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                activeTool = 'pen';
                penBtn.className = "p-2.5 rounded-full transition-all duration-200 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-90";
                eraserBtn.className = "p-2.5 rounded-full transition-all duration-200 text-slate-500 hover:bg-slate-100 active:scale-90";
            });

            eraserBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                activeTool = 'eraser';
                eraserBtn.className = "p-2.5 rounded-full transition-all duration-200 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white shadow-md shadow-indigo-100 active:scale-90";
                penBtn.className = "p-2.5 rounded-full transition-all duration-200 text-slate-500 hover:bg-slate-100 active:scale-90";
            });

            document.getElementById(`clear-${side}`).addEventListener('click', (e) => {
                e.stopPropagation();
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            window.addEventListener('resize', configureRetinaDimensions);
            configureRetinaDimensions();
        }

        bootstrapBoard('canvas-left', 'pane-left', 'left');
        bootstrapBoard('canvas-right', 'pane-right', 'right');

        // Start in single-view mode; split screen remains available from the header.
        updateLayoutMode('single');
    </script>
</body>
</html>
